<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the FILTER action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">THE TREADMILL</text>
  <text class="small" x="720" y="78">You feel busy but goals don't move.</text>
  <text class="small" x="720" y="94">Stop reacting to noise. Filter it.</text>

  <text class="verb" x="480" y="142">FILTER</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="500" height="150"/>
  <text class="letter" x="60" y="222">F</text>
  <text class="label" x="105" y="204">FIND THE NOISE</text>
  <text class="small" x="105" y="224">Brain dump every single task, errand, and email.</text>
  <text class="tiny" x="105" y="242">Do not organize yet. Just get it out of your head.</text>
  <line class="fillline" x1="60" y1="270" x2="510" y2="270"/>
  <line class="fillline" x1="60" y1="295" x2="510" y2="295"/>
  <line class="fillline" x1="60" y1="320" x2="510" y2="320"/>

  <rect class="box" x="560" y="180" width="500" height="150"/>
  <text class="letter" x="580" y="222">I</text>
  <text class="label" x="625" y="204">ISOLATE THE BIG ROCKS</text>
  <text class="small" x="625" y="224">Pick the top 3 tasks that actually move your goals.</text>
  <text class="tiny" x="625" y="242">Ignore easy chores. Choose the heavy, impactful work.</text>
  <text class="tiny" x="580" y="270">1.</text><line class="fillline" x1="600" y1="270" x2="1030" y2="270"/>
  <text class="tiny" x="580" y="295">2.</text><line class="fillline" x1="600" y1="295" x2="1030" y2="295"/>
  <text class="tiny" x="580" y="320">3.</text><line class="fillline" x1="600" y1="320" x2="1030" y2="320"/>

  <rect class="box" x="40" y="350" width="500" height="150"/>
  <text class="letter" x="60" y="392">L</text>
  <text class="label" x="105" y="374">LOCK THE TIME</text>
  <text class="small" x="105" y="394">Block specific start and end times on your calendar.</text>
  <text class="tiny" x="105" y="412">Put them early. Treat it like an unmissable appointment.</text>
  <text class="tiny" x="60" y="440">Task 1:</text><line class="fillline" x1="115" y1="440" x2="250" y2="440"/>
  <text class="tiny" x="260" y="440">Time:</text><line class="fillline" x1="300" y1="440" x2="510" y2="440"/>
  <text class="tiny" x="60" y="465">Task 2:</text><line class="fillline" x1="115" y1="465" x2="250" y2="465"/>
  <text class="tiny" x="260" y="465">Time:</text><line class="fillline" x1="300" y1="465" x2="510" y2="465"/>
  <text class="tiny" x="60" y="490">Task 3:</text><line class="fillline" x1="115" y1="490" x2="250" y2="490"/>
  <text class="tiny" x="260" y="490">Time:</text><line class="fillline" x1="300" y1="490" x2="510" y2="490"/>

  <rect class="box" x="560" y="350" width="500" height="150"/>
  <text class="letter" x="580" y="392">T</text>
  <text class="label" x="625" y="374">TAME DISTRACTIONS</text>
  <text class="small" x="625" y="394">Define physical and digital boundaries before you start.</text>
  <text class="tiny" x="625" y="412">Don't rely on willpower. Change your environment.</text>
  <rect class="mini" x="580" y="435" width="12" height="12"/>
  <text class="tiny" x="600" y="446">Phone in another room / drawer</text>
  <rect class="mini" x="580" y="460" width="12" height="12"/>
  <text class="tiny" x="600" y="471">Close all extra browser tabs</text>
  <rect class="mini" x="580" y="485" width="12" height="12"/>
  <text class="tiny" x="600" y="496">Message team: "In focus mode until [time]"</text>

  <rect class="box" x="40" y="520" width="500" height="150"/>
  <text class="letter" x="60" y="562">E</text>
  <text class="label" x="105" y="544">EXECUTE THE SPRINT</text>
  <text class="small" x="105" y="564">Work in focused sprints. Do not stop until the timer rings.</text>
  <text class="tiny" x="105" y="582">No switching tasks. No checking email. Just the work.</text>
  <text class="tiny" x="60" y="615">Sprint Length:</text><line class="fillline" x1="150" y1="615" x2="250" y2="615"/>
  <text class="tiny" x="270" y="615">Break Length:</text><line class="fillline" x1="365" y1="615" x2="510" y2="615"/>
  <text class="tiny" x="60" y="645">Strict Rule:</text><line class="fillline" x1="135" y1="645" x2="510" y2="645"/>

  <rect class="box" x="560" y="520" width="500" height="150"/>
  <text class="letter" x="580" y="562">R</text>
  <text class="label" x="625" y="544">REVIEW AND ROLL OVER</text>
  <text class="small" x="625" y="564">Check off wins. Move critical unfinished tasks to tomorrow.</text>
  <text class="tiny" x="625" y="582">Delete or delegate the low-value items that kept getting pushed.</text>
  <text class="tiny" x="580" y="615">Completed:</text><line class="fillline" x1="650" y1="615" x2="1030" y2="615"/>
  <text class="tiny" x="580" y="645">Rolling to tomorrow:</text><line class="fillline" x1="700" y1="645" x2="1030" y2="645"/>

  <rect class="mini" x="40" y="695" width="1020" height="60"/>
  <text class="label" x="60" y="720">THE HAMMER</text>
  <text class="small" x="60" y="740">The Hammer only works if you swing it. Fill this out completely, set your boundaries, and do the work that actually matters.</text>

  <rect class="mini" x="40" y="770" width="315" height="60"/>
  <text class="num" x="60" y="805">1</text>
  <text class="label" x="95" y="795">DUMP IT</text>
  <text class="tiny" x="95" y="815">Get every task out of your head.</text>
  <text class="tiny" x="95" y="827">Stop trusting your working memory.</text>

  <rect class="mini" x="392" y="770" width="315" height="60"/>
  <text class="num" x="412" y="805">2</text>
  <text class="label" x="447" y="795">BLOCK IT</text>
  <text class="tiny" x="447" y="815">Isolate the top 3 and lock the time.</text>
  <text class="tiny" x="447" y="827">Protect your calendar like a fortress.</text>

  <rect class="mini" x="745" y="770" width="315" height="60"/>
  <text class="num" x="765" y="805">3</text>
  <text class="label" x="800" y="795">SWING IT</text>
  <text class="tiny" x="800" y="815">Execute in focused sprints without stopping.</text>
  <text class="tiny" x="800" y="827">Turn your energy into a single point of impact.</text>
</svg>