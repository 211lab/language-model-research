<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the Prioritization and Time Management action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">Master Your Tasks: Prioritization and Time Management</text>
  <text class="sub" x="40" y="96">Sort, Triage, Reschedule, Unload, Complete, Track, Understand</text>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">S</text>
  <text class="label" x="105" y="204">SORT: Create a complete inventory</text>
  <text class="small" x="105" y="224">List all tasks, big and small.</text>
  <text class="tiny" x="105" y="242">Avoid vague categories.</text>
  <line class="fillline" x1="60" y1="270" x2="330" y2="270"/>
  <line class="fillline" x1="60" y1="300" x2="330" y2="300"/>
  <line class="fillline" x1="60" y1="330" x2="330" y2="330"/>

  <rect class="box" x="390" y="180" width="320" height="185"/>
  <text class="letter" x="410" y="222">T</text>
  <text class="label" x="455" y="204">TRIAGE: Categorize using Eisenhower Matrix</text>
  <text class="small" x="455" y="224">Urgent/Important assessment.</text>
  <text class="tiny" x="455" y="242">Avoid automatic urgency labeling.</text>
  <line class="fillline" x1="410" y1="270" x2="680" y2="270"/>
  <line class="fillline" x1="410" y1="300" x2="680" y2="300"/>
  <line class="fillline" x1="410" y1="330" x2="680" y2="330"/>

  <rect class="box" x="740" y="180" width="320" height="185"/>
  <text class="letter" x="760" y="222">R</text>
  <text class="label" x="805" y="204">RESCHEDULE: Schedule Important tasks</text>
  <text class="small" x="805" y="224">Treat them like appointments.</text>
  <text class="tiny" x="805" y="242">Break down large tasks.</text>
  <line class="fillline" x1="760" y1="270" x2="1030" y2="270"/>
  <line class="fillline" x1="760" y1="300" x2="1030" y2="300"/>
  <line class="fillline" x1="760" y1="330" x2="1030" y2="330"/>

  <rect class="box" x="40" y="395" width="320" height="185"/>
  <text class="letter" x="60" y="437">U</text>
  <text class="label" x="105" y="419">UNLOAD: Delegate when possible</text>
  <text class="small" x="105" y="439">Let go of tasks others can do.</text>
  <text class="tiny" x="105" y="457">Avoid control issues.</text>
  <line class="fillline" x1="60" y1="485" x2="330" y2="485"/>
  <line class="fillline" x1="60" y1="515" x2="330" y2="515"/>
  <line class="fillline" x1="60" y1="545" x2="330" y2="545"/>

  <rect class="box" x="390" y="395" width="320" height="185"/>
  <text class="letter" x="410" y="437">C</text>
  <text class="label" x="455" y="419">COMPLETE: Focus on one task</text>
  <text class="small" x="455" y="439">Eliminate distractions.</text>
  <text class="tiny" x="455" y="457">Use Pomodoro technique.</text>
  <line class="fillline" x1="410" y1="485" x2="680" y2="485"/>
  <line class="fillline" x1="410" y1="515" x2="680" y2="515"/>
  <line class="fillline" x1="410" y1="545" x2="680" y2="545"/>

  <rect class="box" x="740" y="395" width="320" height="185"/>
  <text class="letter" x="760" y="437">T</text>
  <text class="label" x="805" y="419">TRACK: Review progress & adjust</text>
  <text class="small" x="805" y="439">Celebrate accomplishments.</text>
  <text class="tiny" x="805" y="457">Keep a simple log.</text>
  <line class="fillline" x1="760" y1="485" x2="1030" y2="485"/>
  <line class="fillline" x1="760" y1="515" x2="1030" y2="515"/>
  <line class="fillline" x1="760" y1="545" x2="1030" y2="545"/>

  <rect class="box" x="40" y="610" width="320" height="185"/>
  <text class="letter" x="60" y="652">U</text>
  <text class="label" x="105" y="634">UNDERSTAND: Reflect & Refine</text>
  <text class="small" x="105" y="654">Continuously improve your system.</text>
  <text class="tiny" x="105" y="672">Be willing to experiment.</text>
  <line class="fillline" x1="60" y1="695" x2="330" y2="695"/>
  <line class="fillline" x1="60" y1="725" x2="330" y2="725"/>
  <line class="fillline" x1="60" y1="755" x2="330" y2="755"/>

  <rect class="mini" x="40" y="725" width="315" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">LIST</text>
  <text class="tiny" x="95" y="768">All tasks, big and small.</text>
  <text class="tiny" x="95" y="784">Brain dump everything.</text>

  <rect class="mini" x="392" y="725" width="315" height="82"/>
  <text class="num" x="412" y="760">2</text>
  <text class="label" x="447" y="748">PRIORITIZE</text>
  <text class="tiny" x="447" y="768">Eisenhower Matrix.</text>
  <text class="tiny" x="447" y="784">Urgent vs. Important.</text>

  <rect class="mini" x="745" y="725" width="315" height="82"/>
  <text class="num" x="765" y="760">3</text>
  <text class="label" x="800" y="748">ACT</text>
  <text class="tiny" x="800" y="768">Schedule, Delegate, Focus.</text>
  <text class="tiny" x="800" y="784">One task at a time.</text>
</svg>