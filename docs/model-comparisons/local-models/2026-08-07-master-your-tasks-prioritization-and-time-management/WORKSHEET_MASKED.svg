<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, and five sequential fillable sections built around the F-O-C-U-S task management process.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
      .censor { fill: #b0b0b0; }
      .censor-light { fill: #c0c0c0; }
      .censor-medium { fill: #a0a0a0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <!-- Title Zone -->
  <text class="title" x="40" y="70">MASTER YOUR TASKS:</text>
  <text class="title" x="40" y="110">PRIORITIZATION AND TIME MANAGEMENT</text>
  <rect class="censor-medium" x="40" y="135" width="580" height="25"/>

  <!-- Process Header -->
  <text class="verb" x="444" y="190">F-O-C-U-S</text>
  <line class="line" x1="40" y1="202" x2="1060" y2="202"/>

  <!-- Step 1: F - Find All Tasks (Brain Dump) -->
  <rect class="box" x="40" y="230" width="280" height="180"/>
  <text class="letter" x="60" y="272">F</text>
  <rect class="censor-light" x="105" y="250" width="175" height="24"/>
  <rect class="censor-medium" x="105" y="270" width="175" height="24"/>
  <rect class="censor-light" x="105" y="290" width="175" height="24"/>

  <line class="fillline" x1="60" y1="315" x2="290" y2="315"/>
  <line class="fillline" x1="60" y1="345" x2="290" y2="345"/>
  <line class="fillline" x1="60" y1="375" x2="290" y2="375"/>
  <line class="fillline" x1="60" y1="405" x2="290" y2="405"/>

  <!-- Step 2: O - Organize by Importance -->
  <rect class="box" x="350" y="230" width="280" height="180"/>
  <text class="letter" x="370" y="272">O</text>
  <rect class="censor-medium" x="415" y="250" width="175" height="24"/>
  <rect class="censor-light" x="415" y="270" width="175" height="24"/>
  <rect class="censor-medium" x="415" y="290" width="175" height="24"/>

  <line class="fillline" x1="370" y1="315" x2="600" y2="315"/>
  <line class="fillline" x1="370" y1="345" x2="600" y2="345"/>
  <line class="fillline" x1="370" y1="375" x2="600" y2="375"/>
  <line class="fillline" x1="370" y1="405" x2="600" y2="405"/>

  <!-- Step 3: C - Commit to the Top Tasks -->
  <rect class="box" x="650" y="230" width="280" height="180"/>
  <text class="letter" x="670" y="272">C</text>
  <rect class="censor-light" x="715" y="250" width="175" height="24"/>
  <rect class="censor-medium" x="715" y="270" width="175" height="24"/>
  <rect class="censor-light" x="715" y="290" width="175" height="24"/>

  <line class="fillline" x1="670" y1="315" x2="900" y2="315"/>
  <line class="fillline" x1="670" y1="345" x2="900" y2="345"/>
  <line class="fillline" x1="670" y1="375" x2="900" y2="375"/>

  <!-- Step 4: U - Uninterruptible Deep Work -->
  <rect class="box" x="40" y="440" width="280" height="180"/>
  <text class="letter" x="60" y="482">U</text>
  <rect class="censor-medium" x="105" y="460" width="175" height="24"/>
  <rect class="censor-light" x="105" y="480" width="175" height="24"/>
  <rect class="censor-medium" x="105" y="500" width="175" height="24"/>

  <line class="fillline" x1="60" y1="525" x2="290" y2="525"/>
  <line class="fillline" x1="60" y1="555" x2="290" y2="555"/>
  <line class="fillline" x1="60" y1="585" x2="290" y2="585"/>

  <!-- Step 5: S - Systematically Review and Adjust -->
  <rect class="box" x="350" y="440" width="280" height="180"/>
  <text class="letter" x="370" y="482">S</text>
  <rect class="censor-light" x="415" y="460" width="175" height="24"/>
  <rect class="censor-medium" x="415" y="480" width="175" height="24"/>
  <rect class="censor-light" x="415" y="500" width="175" height="24"/>

  <line class="fillline" x1="370" y1="525" x2="600" y2="525"/>
  <line class="fillline" x1="370" y1="555" x2="600" y2="555"/>
  <line class="fillline" x1="370" y1="585" x2="600" y2="585"/>

  <!-- Footer/Commitment Zone -->
  <rect class="mini" x="40" y="660" width="1020" height="80"/>
  <rect class="censor-medium" x="60" y="680" width="960" height="24"/>
  <rect class="censor-light" x="60" y="705" width="960" height="24"/>
  <line class="fillline" x1="60" y1="730" x2="1030" y2="730"/>

  <!-- Reflection/Final Check -->
  <rect class="mini" x="40" y="760" width="315" height="82"/>
  <text class="num" x="60" y="795">1</text>
  <rect class="censor-medium" x="95" y="775" width="120" height="24"/>
  <rect class="censor-light" x="95" y="795" width="120" height="24"/>
  <line class="fillline" x1="60" y1="815" x2="330" y2="815"/>

  <rect class="mini" x="392" y="760" width="315" height="82"/>
  <text class="num" x="412" y="795">2</text>
  <rect class="censor-medium" x="447" y="775" width="120" height="24"/>
  <rect class="censor-light" x="447" y="795" width="120" height="24"/>
  <line class="fillline" x1="370" y1="815" x2="600" y2="815"/>

  <rect class="mini" x="745" y="760" width="315" height="82"/>
  <text class="num" x="765" y="795">3</text>
  <rect class="censor-medium" x="800" y="775" width="120" height="24"/>
  <rect class="censor-light" x="800" y="795" width="120" height="24"/>
  <line class="fillline" x1="745" y1="815" x2="1030" y2="815"/>
</svg>