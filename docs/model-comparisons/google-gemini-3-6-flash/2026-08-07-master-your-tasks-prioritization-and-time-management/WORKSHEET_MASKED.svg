  <rect class="box" x="740" y="175" width="320" height="195"/>
  <text class="letter" x="760" y="217">L</text>
  <rect x="805" y="187" width="125" height="14" fill="#cccccc" rx="2"/>
  <rect x="805" y="210" width="190" height="11" fill="#e2e2e2" rx="2"/>
