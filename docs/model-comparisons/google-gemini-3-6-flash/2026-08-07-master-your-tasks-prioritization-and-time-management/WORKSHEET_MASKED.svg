  <rect x="455" y="210" width="210" height="11" fill="#dddddd" rx="2"/>
  <rect x="455" y="229" width="225" height="9" fill="#d0d0d0" rx="2"/>
  <rect x="410" y="257" width="12" height="9" fill="#bcbcbc" rx="2"/><line class="fillline" x1="428" y1="265" x2="680" y2="265"/>
