  <rect x="760" y="257" width="92" height="9" fill="#c5c5c5" rx="2"/><line class="fillline" x1="860" y1="265" x2="1030" y2="265"/>
  <rect x="760" y="285" width="88" height="9" fill="#c5c5c5" rx="2"/><line class="fillline" x1="855" y1="293" x2="1030" y2="293"/>
  <rect x="760" y="313" width="72" height="9" fill="#c5c5c5" rx="2"/><line class="fillline" x1="840" y1="321" x2="1030" y2="321"/>
  <rect x="760" y="341" width="35" height="9" fill="#c5c5c5" rx="2"/><line class="fillline" x1="800" y1="349" x2="1030" y2="349"/>

  <!-- STEP 4: T - TIME BLOCK PRIORITIES -->
  <rect class="box" x="40" y="385" width="320" height="195"/>
  <text class="letter" x="60" y="427">T</text>
  <rect x="105" y="397" width="165" height="14" fill="#c8c8c8" rx="2"/>
  <rect x="105" y="420" width="225" height="11" fill="#dedede" rx="2"/>
  <rect x="105" y="439" width="195" height="9" fill="#d2d2d2" rx="2"/>
  <rect x="60" y="467" width="38" height="9" fill="#c2c2c2" rx="2"/><line class="fillline" x1="105" y1="475" x2="330" y2="475"/>
  <rect x="60" y="495" width="38" height="9" fill="#c2c2c2" rx="2"/><line class="fillline" x1="105" y1="503" x2="330" y2="503"/>
  <rect x="60" y="523" width="68" height="9" fill="#c2c2c2" rx="2"/><line class="fillline" x1="135" y1="531" x2="330" y2="531"/>
  <rect x="60" y="551" width="58" height="9" fill="#c2c2c2" rx="2"/><line class="fillline" x1="125" y1="559" x2="330" y2="559"/>

  <!-- STEP 5: E - ELIMINATE DISTRACTIONS -->
  <rect class="box" x="390" y="385" width="320" height="195"/>
  <text class="letter" x="410" y="427">E</text>
  <rect x="455" y="397" width="175" height="14" fill="#cdcdcd" rx="2"/>
  <rect x="455" y="420" width="215" height="11" fill="#e1e1e1" rx="2"/>
  <rect x="455" y="439" width="230" height="9" fill="#d6d6d6" rx="2"/>
  <rect x="410" y="467" width="72" height="9" fill="#c4c4c4" rx="2"/><line class="fillline" x1="490" y1="475" x2="680" y2="475"/>
  <rect x="410" y="495" width="62" height="9" fill="#c4c4c4" rx="2"/><line class="fillline" x1="480" y1="503" x2="680" y2="503"/>
  <rect x="410" y="523" width="78" height="9" fill="#c4c4c4" rx="2"/><line class="fillline" x1="495" y1="531" x2="680" y2="531"/>
  <rect x="410" y="551" width="78" height="9" fill="#c4c4c4" rx="2"/><line class="fillline" x1="495" y1="559" x2="680" y2="559"/>

  <!-- STEP 6: R - REVIEW AND RESET DAILY -->
  <rect class="box" x="740" y="385" width="320" height="195"/>
  <text class="letter" x="760" y="427">R</text>
  <rect x="805" y="397" width="180" height="14" fill="#c7c7c7" rx="2"/>
  <rect x="805" y="420" width="220" height="11" fill="#dedede" rx="2"/>
  <rect x="805" y="439" width="220" height="9" fill="#d0d0d0" rx="2"/>
  <rect x="760" y="467" width="54" height="9" fill="#c1c1c1" rx="2"/><line class="fillline" x1="820" y1="475" x2="1030" y2="475"/>
  <rect x="760" y="495" width="78" height="9" fill="#c1c1c1" rx="2"/><line class="fillline" x1="845" y1="503" x2="1030" y2="503"/>
  <rect x="760" y="523" width="92" height="9" fill="#c1c1c1" rx="2"/><line class="fillline" x1="860" y1="531" x2="1030" y2="531"/>
  <rect x="760" y="551" width="92" height="9" fill="#c1c1c1" rx="2"/><line class="fillline" x1="860" y1="559" x2="1030" y2="559"/>

  <!-- FINAL COMMAND / EXECUTION -->
  <rect class="mini" x="40" y="595" width="1020" height="88"/>
  <rect x="60" y="609" width="280" height="14" fill="#c2c2c2" rx="2"/>
  <rect x="60" y="636" width="225" height="11" fill="#dbdbdb" rx="2"/>
  <line class="fillline" x1="295" y1="645" x2="1030" y2="645"/>
  <rect x="60" y="660" width="540" height="11" fill="#d0d0d0" rx="2"/>

  <!-- SUMMARY FOOTER -->
  <rect class="mini" x="40" y="698" width="315" height="85"/>
  <text class="num" x="60" y="733">1</text>
  <rect x="95" y="709" width="100" height="14" fill="#c6c6c6" rx="2"/>
  <rect x="95" y="733" width="170" height="9" fill="#dddddd" rx="2"/>
  <rect x="95" y="749" width="210" height="9" fill="#d4d4d4" rx="2"/>

  <rect class="mini" x="392" y="698" width="315" height="85"/>
  <text class="num" x="412" y="733">2</text>
  <rect x="447" y="709" width="90" height="14" fill="#c6c6c6" rx="2"/>
  <rect x="447" y="733" width="180" height="9" fill="#dddddd" rx="2"/>
  <rect x="447" y="749" width="195" height="9" fill="#d4d4d4" rx="2"/>

  <rect class="mini" x="745" y="698" width="315" height="85"/>
  <text class="num" x="765" y="733">3</text>
  <rect x="800" y="709" width="130" height="14" fill="#c6c6c6" rx="2"/>
  <rect x="800" y="733" width="175" height="9" fill="#dddddd" rx="2"/>
  <rect x="800" y="749" width="195" height="9" fill="#d4d4d4" rx="2"/>
</svg>