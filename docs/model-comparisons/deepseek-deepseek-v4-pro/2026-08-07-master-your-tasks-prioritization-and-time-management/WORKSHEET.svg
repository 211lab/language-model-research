<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet: Master Your Tasks - Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the EXECUTE action model, and a three-step process summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <!-- Branding and Header -->
  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization &amp; Time Management</text>

  <!-- Top Right Context Box -->
  <rect class="mini" x="650" y="34" width="410" height="78"/>
  <text class="label" x="670" y="58">MOMENT OF TRUTH</text>
  <text class="small" x="670" y="78">The choice: stay busy and scattered, or pick 3</text>
  <text class="small" x="670" y="94">high-impact tasks and hammer them until done.</text>

  <!-- Center Verb Process Title -->
  <text class="verb" x="460" y="142">EXECUTE</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <!-- ROW 1: E, X, E -->
  <!-- Box 1: E - Eliminate -->
  <rect class="box" x="40" y="180" width="310" height="185"/>
  <text class="letter" x="60" y="222">E</text>
  <text class="label" x="105" y="204">ELIMINATE THE NOISE</text>
  <text class="small" x="105" y="224">List exact distractions and your shutdown plan.</text>
  <text class="tiny" x="105" y="242">Mute, close tabs, reorient chair. Build the bubble.</text>
  <line class="fillline" x1="60" y1="270" x2="320" y2="270"/>
  <line class="fillline" x1="60" y1="300" x2="320" y2="300"/>
  <line class="fillline" x1="60" y1="330" x2="320" y2="330"/>

  <!-- Box 2: X - eXamine -->
  <rect class="box" x="395" y="180" width="310" height="185"/>
  <text class="letter" x="415" y="222">X</text>
  <text class="label" x="460" y="204">eXAMINE YOUR LIST</text>
  <text class="small" x="460" y="224">Brain dump tasks. Filter ruthlessly to 3 A-tasks.</text>
  <text class="tiny" x="460" y="242">If everything is a priority, nothing is.</text>
  <text class="tiny" x="415" y="268">A1.</text><line class="fillline" x1="445" y1="268" x2="675" y2="268"/>
  <text class="tiny" x="415" y="298">A2.</text><line class="fillline" x1="445" y1="298" x2="675" y2="298"/>
  <text class="tiny" x="415" y="328">A3.</text><line class="fillline" x1="445" y1="328" x2="675" y2="328"/>

  <!-- Box 3: E - Engage -->
  <rect class="box" x="750" y="180" width="310" height="185"/>
  <text class="letter" x="770" y="222">E</text>
  <text class="label" x="815" y="204">ENGAGE ONE PRIORITY</text>
  <text class="small" x="815" y="224">Sprint log: 25-min block, single-task, no breaks.</text>
  <text class="tiny" x="815" y="242">Mark stayed or drifted. Return immediately.</text>
  <text class="tiny" x="770" y="270">1.</text><line class="fillline" x1="790" y1="270" x2="1030" y2="270"/>
  <text class="tiny" x="770" y="300">2.</text><line class="fillline" x1="790" y1="300" x2="1030" y2="300"/>
  <text class="tiny" x="770" y="330">3.</text><line class="fillline" x1="790" y1="330" x2="1030" y2="330"/>

  <!-- ROW 2: C, U, T -->
  <!-- Box 4: C - Complete -->
  <rect class="box" x="40" y="395" width="310" height="185"/>
  <text class="letter" x="60" y="437">C</text>
  <text class="label" x="105" y="419">COMPLETE BEFORE SWITCHING</text>
  <text class="small" x="105" y="439">Define a defensible stopping point. Finish the chunk.</text>
  <text class="tiny" x="105" y="457">Don't leave work mid-sentence. Close the loop.</text>
  <line class="fillline" x1="60" y1="485" x2="320" y2="485"/>
  <line class="fillline" x1="60" y1="515" x2="320" y2="515"/>
  <line class="fillline" x1="60" y1="545" x2="320" y2="545"/>

  <!-- Box 5: U - Use Time Blocks -->
  <rect class="box" x="395" y="395" width="310" height="185"/>
  <text class="letter" x="415" y="437">U</text>
  <text class="label" x="460" y="419">USE TIME BLOCKS</text>
  <text class="small" x="460" y="439">Transfer A-tasks into morning forge blocks.</text>
  <text class="tiny" x="460" y="457">Treat them like unmissable appointments.</text>
  <text class="tiny" x="415" y="485">Time:</text><line class="fillline" x1="455" y1="485" x2="675" y2="485"/>
  <text class="tiny" x="415" y="515">Task:</text><line class="fillline" x1="455" y1="515" x2="675" y2="515"/>
  <text class="tiny" x="415" y="545">Time:</text><line class="fillline" x1="455" y1="545" x2="675" y2="545"/>

  <!-- Box 6: T - Track -->
  <rect class="box" x="750" y="395" width="310" height="185"/>
  <text class="letter" x="770" y="437">T</text>
  <text class="label" x="815" y="419">TRACK WHAT GOT DONE</text>
  <text class="small" x="815" y="439">Check off wins. Compare plan vs. actual execution.</text>
  <text class="tiny" x="815" y="457">If incomplete, write ONE specific fixable reason.</text>
  <text class="tiny" x="770" y="485">Done:</text><line class="fillline" x1="815" y1="485" x2="1030" y2="485"/>
  <text class="tiny" x="770" y="515">Reason:</text><line class="fillline" x1="815" y1="515" x2="1030" y2="515"/>
  <text class="tiny" x="770" y="545">Done:</text><line class="fillline" x1="815" y1="545" x2="1030" y2="545"/>

  <!-- Full Width Box: E - Evaluate & Adjust -->
  <rect class="box" x="40" y="610" width="1020" height="130"/>
  <text class="letter" x="60" y="652">E</text>
  <text class="label" x="105" y="636">EVALUATE &amp; ADJUST DAILY</text>
  <text class="small" x="105" y="656">5-minute review. What worked? What didn't? Move, cut, or resize for tomorrow.</text>
  <text class="tiny" x="105" y="678">1. My 3 A-tasks were: (check if done)</text>
  <line class="fillline" x1="105" y1="690" x2="1030" y2="690"/>
  <text class="tiny" x="105" y="706">2. I was pulled off course by:</text>
  <line class="fillline" x1="105" y1="718" x2="1030" y2="718"/>
  <text class="tiny" x="105" y="734">3. Tomorrow's single adjustment:</text>
  <line class="fillline" x1="105" y1="746" x2="1030" y2="746"/>

  <!-- Footer: Three-Step Process Summary -->
  <rect class="mini" x="40" y="765" width="310" height="82"/>
  <text class="num" x="60" y="800">1</text>
  <text class="label" x="95" y="788">SET THE FORGE</text>
  <text class="tiny" x="95" y="808">Eliminate noise and pick your 3</text>
  <text class="tiny" x="95" y="824">high-impact A-tasks for the day.</text>

  <rect class="mini" x="395" y="765" width="310" height="82"/>
  <text class="num" x="415" y="800">2</text>
  <text class="label" x="450" y="788">SWING THE HAMMER</text>
  <text class="tiny" x="450" y="808">Protect time, single-task until done,</text>
  <text class="tiny" x="450" y="824">and close the loop before switching.</text>

  <rect class="mini" x="750" y="765" width="310" height="82"/>
  <text class="num" x="770" y="800">3</text>
  <text class="label" x="805" y="788">REFINE THE BLADE</text>
  <text class="tiny" x="805" y="808">Track real completion data and</text>
  <text class="tiny" x="805" y="824">adjust one variable for tomorrow.</text>
</svg>