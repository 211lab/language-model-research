  <rect class="censor3" x="586" y="504" width="154" height="8" rx="1" ry="1"/><rect class="censor5" x="748" y="506" width="292" height="6" rx="2" ry="2"/>
  <rect class="censor2" x="586" y="528" width="154" height="8" rx="1" ry="1"/><rect class="censor" x="748" y="530" width="292" height="6" rx="2" ry="2"/>
