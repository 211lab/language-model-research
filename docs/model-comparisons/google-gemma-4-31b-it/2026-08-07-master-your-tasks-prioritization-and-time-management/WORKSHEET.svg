<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the FILTER action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS: PRIORITIZATION AND TIME MANAGEMENT</text>
  <text class="sub" x="40" y="96">Stop Reacting and Start Controlling</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">THE GOAL</text>
  <text class="small" x="720" y="78">Separate the noise from the needle-movers to eliminate</text>
  <text class="small" x="720" y="94">midnight panic and direct energy toward high-leverage outcomes.</text>

  <text class="verb" x="444" y="142">FILTER</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="510" height="210"/>
  <text class="letter" x="60" y="222">F</text>
  <text class="label" x="105" y="204">FLUSH THE SYSTEM</text>
  <text class="small" x="105" y="224">Perform a total brain dump of every task, errand, and worry.</text>
  <text class="tiny" x="105" y="242">Do not organize. Just empty your mental RAM.</text>
  <line class="fillline" x1="60" y1="270" x2="500" y2="270"/>
  <line class="fillline" x1="60" y1="295" x2="500" y2="295"/>
  <line class="fillline" x1="60" y1="320" x2="500" y2="320"/>
  <line class="fillline" x1="60" y1="345" x2="500" y2="345"/>
  <line class="fillline" x1="60" y1="370" x2="500" y2="370"/>
  <line class="fillline" x1="60" y1="395" x2="500" y2="395"/>

  <rect class="box" x="550" y="180" width="510" height="210"/>
  <text class="letter" x="570" y="222">I</text>
  <text class="label" x="615" y="204">IDENTIFY THE ROCKS</text>
  <text class="small" x="615" y="224">Select 2-3 high-leverage tasks that make the day a win.</text>
  <text class="tiny" x="615" y="242">Avoid "urgent" noise; focus on "important" impact.</text>
  <text class="tiny" x="570" y="275">ROCK 1:</text><line class="fillline" x1="630" y1="275" x2="1030" y2="275"/>
  <text class="tiny" x="570" y="310">ROCK 2:</text><line class="fillline" x1="630" y1="310" x2="1030" y2="310"/>
  <text class="tiny" x="570" y="345">ROCK 3:</text><line class="fillline" x1="630" y1="345" x2="1030" y2="345"/>

  <rect class="box" x="40" y="415" width="320" height="185"/>
  <text class="letter" x="60" y="457">L</text>
  <text class="label" x="105" y="439">LOCK THE CALENDAR</text>
  <text class="small" x="105" y="459">Assign Big Rocks to specific time blocks.</text>
  <text class="tiny" x="105" y="477">Example: 9:00 AM – 11:00 AM: Draft Proposal.</text>
  <line class="fillline" x1="60" y1="505" x2="330" y2="505"/>
  <line class="fillline" x1="60" y1="535" x2="330" y2="535"/>
  <line class="fillline" x1="60" y1="565" x2="330" y2="565"/>

  <rect class="box" x="390" y="415" width="320" height="185"/>
  <text class="letter" x="410" y="457">T</text>
  <text class="label" x="455" y="439">TARGET THE FOCUS</text>
  <text class="small" x="455" y="459">Define your focus protocol and distractions to kill.</text>
  <text class="tiny" x="455" y="477">Example: Phone in other room, Slack closed.</text>
  <line class="fillline" x1="410" y1="505" x2="680" y2="505"/>
  <line class="fillline" x1="410" y1="535" x2="680" y2="535"/>
  <line class="fillline" x1="410" y1="565" x2="680" y2="565"/>

  <rect class="box" x="740" y="415" width="320" height="185"/>
  <text class="letter" x="760" y="457">E</text>
  <text class="label" x="805" y="439">EXECUTE THE BATCH</text>
  <text class="small" x="805" y="459">Group low-value tasks into one single block.</text>
  <text class="tiny" x="805" y="477">Emails, calls, and admin. Set a specific time.</text>
  <text class="tiny" x="760" y="505">Time Block:</text><line class="fillline" x1="830" y1="505" x2="1030" y2="505"/>
  <text class="tiny" x="760" y="535">Tasks:</text><line class="fillline" x1="800" y1="535" x2="1030" y2="535"/>
  <text class="tiny" x="760" y="565">Tasks:</text><line class="fillline" x1="800" y1="565" x2="1030" y2="565"/>

  <rect class="box" x="40" y="620" width="1020" height="110"/>
  <text class="letter" x="60" y="662">R</text>
  <text class="label" x="105" y="644">REVIEW AND RESET</text>
  <text class="small" x="105" y="664">Define your shutdown ritual and set tomorrow's Big Rocks.</text>
  <text class="tiny" x="105" y="682">What are the 3 non-negotiables for tomorrow?</text>
  <line class="fillline" x1="105" y1="710" x2="1030" y2="710"/>
  <line class="fillline" x1="105" y1="730" x2="1030" y2="730"/>

  <rect class="mini" x="40" y="750" width="315" height="70"/>
  <text class="num" x="60" y="780">1</text>
  <text class="label" x="95" y="768">DUMP</text>
  <text class="tiny" x="95" y="788">Clear the mental RAM.</text>
  <text class="tiny" x="95" y="804">See everything.</text>

  <rect class="mini" x="392" y="750" width="315" height="70"/>
  <text class="num" x="412" y="780">2</text>
  <text class="label" x="447" y="768">ISOLATE</text>
  <text class="tiny" x="447" y="788">Pick the 3 Big Rocks.</text>
  <text class="tiny" x="447" y="804">Ignore the noise.</text>

  <rect class="mini" x="745" y="750" width="315" height="70"/>
  <text class="num" x="765" y="780">3</text>
  <text class="label" x="800" y="768">LOCK</text>
  <text class="tiny" x="800" y="788">Schedule the execution.</text>
  <text class="tiny" x="800" y="804">Make it non-negotiable.</text>
</svg>