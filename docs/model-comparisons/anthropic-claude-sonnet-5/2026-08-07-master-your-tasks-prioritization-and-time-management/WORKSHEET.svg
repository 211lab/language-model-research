<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the TRIAGE task-sorting model, and a three phase summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="64">MASTER YOUR TASKS:</text>
  <text class="title" x="40" y="94">PRIORITIZATION AND TIME MANAGEMENT</text>
  <text class="sub" x="40" y="116">Sort Before You Sprint</text>

  <rect class="mini" x="700" y="34" width="360" height="100"/>
  <text class="label" x="720" y="58">WHY THIS MATTERS</text>
  <text class="small" x="720" y="78">Busy days without proof of progress mean a</text>
  <text class="small" x="720" y="94">sorting failure, not a discipline failure.</text>
  <text class="small" x="720" y="110">Rank before you react, one letter at a time.</text>

  <line class="line" x1="40" y1="140" x2="1060" y2="140"/>
  <text class="verb" x="470" y="175">TRIAGE</text>
  <line class="line" x1="40" y1="192" x2="1060" y2="192"/>

  <!-- T - Target Your List -->
  <rect class="box" x="40" y="205" width="320" height="180"/>
  <text class="letter" x="60" y="247">T</text>
  <text class="label" x="105" y="229">TARGET YOUR LIST</text>
  <text class="small" x="105" y="249">Dump every task in your head onto the page.</text>
  <text class="tiny" x="105" y="267">No ranking yet. Specific lines, not vague piles.</text>
  <text class="tiny" x="60" y="286">1.</text><line class="fillline" x1="80" y1="286" x2="340" y2="286"/>
  <text class="tiny" x="60" y="306">2.</text><line class="fillline" x1="80" y1="306" x2="340" y2="306"/>
  <text class="tiny" x="60" y="326">3.</text><line class="fillline" x1="80" y1="326" x2="340" y2="326"/>
  <text class="tiny" x="60" y="346">4.</text><line class="fillline" x1="80" y1="346" x2="340" y2="346"/>
  <text class="tiny" x="60" y="366">5.</text><line class="fillline" x1="80" y1="366" x2="340" y2="366"/>

  <!-- R - Rank By Impact -->
  <rect class="box" x="400" y="205" width="320" height="180"/>
  <text class="letter" x="420" y="247">R</text>
  <text class="label" x="465" y="229">RANK BY IMPACT</text>
  <text class="small" x="465" y="249">Pick exactly 3 tasks that truly move you forward.</text>
  <text class="tiny" x="465" y="267">No ties. Note why each one made the cut.</text>
  <text class="tiny" x="420" y="300">Top 1:</text><line class="fillline" x1="465" y1="300" x2="700" y2="300"/>
  <text class="tiny" x="420" y="330">Top 2:</text><line class="fillline" x1="465" y1="330" x2="700" y2="330"/>
  <text class="tiny" x="420" y="360">Top 3:</text><line class="fillline" x1="465" y1="360" x2="700" y2="360"/>

  <!-- I - Isolate What to Skip -->
  <rect class="box" x="760" y="205" width="320" height="180"/>
  <text class="letter" x="780" y="247">I</text>
  <text class="label" x="825" y="229">ISOLATE WHAT TO SKIP</text>
  <text class="small" x="825" y="249">Give every leftover task a real decision.</text>
  <text class="tiny" x="825" y="267">Delegate, delete, or postpone - no limbo.</text>
  <text class="tiny" x="780" y="286">1.</text><line class="fillline" x1="800" y1="286" x2="1060" y2="286"/>
  <text class="tiny" x="780" y="306">2.</text><line class="fillline" x1="800" y1="306" x2="1060" y2="306"/>
  <text class="tiny" x="780" y="326">3.</text><line class="fillline" x1="800" y1="326" x2="1060" y2="326"/>
  <text class="tiny" x="780" y="346">4.</text><line class="fillline" x1="800" y1="346" x2="1060" y2="346"/>

  <!-- A - Allocate Prime Time -->
  <rect class="box" x="40" y="400" width="320" height="180"/>
  <text class="letter" x="60" y="442">A</text>
  <text class="label" x="105" y="424">ALLOCATE PRIME TIME</text>
  <text class="small" x="105" y="444">Slot your top 3 into your highest-energy hours.</text>
  <text class="tiny" x="105" y="462">Write exact times, not "morning."</text>
  <text class="tiny" x="60" y="490">1)</text><line class="fillline" x1="80" y1="490" x2="200" y2="490"/>
  <text class="tiny" x="205" y="490">Time</text><line class="fillline" x1="235" y1="490" x2="340" y2="490"/>
  <text class="tiny" x="60" y="520">2)</text><line class="fillline" x1="80" y1="520" x2="200" y2="520"/>
  <text class="tiny" x="205" y="520">Time</text><line class="fillline" x1="235" y1="520" x2="340" y2="520"/>
  <text class="tiny" x="60" y="550">3)</text><line class="fillline" x1="80" y1="550" x2="200" y2="550"/>
  <text class="tiny" x="205" y="550">Time</text><line class="fillline" x1="235" y1="550" x2="340" y2="550"/>

  <!-- G - Guard Your Focus -->
  <rect class="box" x="400" y="400" width="320" height="180"/>
  <text class="letter" x="420" y="442">G</text>
  <text class="label" x="465" y="424">GUARD YOUR FOCUS</text>
  <text class="small" x="465" y="444">Name what you'll remove before you start.</text>
  <text class="tiny" x="465" y="462">Sprint structure: 25 min on, 5 min off.</text>
  <text class="tiny" x="420" y="490">Distractions:</text><line class="fillline" x1="550" y1="490" x2="700" y2="490"/>
  <text class="tiny" x="420" y="520">Sprint plan:</text><line class="fillline" x1="550" y1="520" x2="700" y2="520"/>
  <text class="tiny" x="420" y="550">Unavailable to:</text><line class="fillline" x1="550" y1="550" x2="700" y2="550"/>

  <!-- E - Evaluate and Reset -->
  <rect class="box" x="760" y="400" width="320" height="180"/>
  <text class="letter" x="780" y="442">E</text>
  <text class="label" x="825" y="424">EVALUATE AND RESET</text>
  <text class="small" x="825" y="444">Check off what got done at day's end.</text>
  <text class="tiny" x="825" y="462">3 days skipped: cut it, or shrink it.</text>
  <text class="tiny" x="780" y="490">Completed:</text><line class="fillline" x1="900" y1="490" x2="1060" y2="490"/>
  <text class="tiny" x="780" y="520">Carried forward:</text><line class="fillline" x1="920" y1="520" x2="1060" y2="520"/>
  <text class="tiny" x="780" y="550">3-day skip action:</text><line class="fillline" x1="940" y1="550" x2="1060" y2="550"/>

  <rect class="mini" x="40" y="595" width="1020" height="65"/>
  <text class="label" x="60" y="618">FINAL COMMAND</text>
  <text class="small" x="60" y="638">Tomorrow's sorted top 3 - the tasks that actually move things forward:</text>
  <line class="fillline" x1="60" y1="652" x2="1030" y2="652"/>

  <rect class="mini" x="40" y="675" width="315" height="145"/>
  <text class="num" x="60" y="710">1</text>
  <text class="label" x="95" y="698">SORT</text>
  <text class="tiny" x="95" y="718">Target every task, rank the true top 3,</text>
  <text class="tiny" x="95" y="734">isolate the rest without guilt or limbo.</text>
  <line class="fillline" x1="60" y1="752" x2="340" y2="752"/>
  <line class="fillline" x1="60" y1="776" x2="340" y2="776"/>

  <rect class="mini" x="392" y="675" width="315" height="145"/>
  <text class="num" x="412" y="710">2</text>
  <text class="label" x="447" y="698">SCHEDULE</text>
  <text class="tiny" x="447" y="718">Allocate top 3 tasks to named, exact</text>
  <text class="tiny" x="447" y="734">time blocks. Batch the small stuff.</text>
  <line class="fillline" x1="412" y1="752" x2="692" y2="752"/>
  <line class="fillline" x1="412" y1="776" x2="692" y2="776"/>

  <rect class="mini" x="745" y="675" width="315" height="145"/>
  <text class="num" x="765" y="710">3</text>
  <text class="label" x="800" y="698">PROTECT &amp; REVIEW</text>
  <text class="tiny" x="800" y="718">Guard the block with named sprints,</text>
  <text class="tiny" x="800" y="734">then evaluate and reset at day's end.</text>
  <line class="fillline" x1="765" y1="752" x2="1045" y2="752"/>
  <line class="fillline" x1="765" y1="776" x2="1045" y2="776"/>
</svg>