<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the TRIAGE task-sorting model, and a three phase summary footer. Content masked.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .mask1 { fill: #e4e4e4; }
      .mask2 { fill: #dcdcdc; }
      .mask3 { fill: #d4d4d4; }
      .mask4 { fill: #ececec; }
      .mask5 { fill: #cfcfcf; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <rect class="mask1" x="40" y="24" width="55" height="14"/>
  <text class="title" x="40" y="64">MASTER YOUR TASKS:</text>
  <text class="title" x="40" y="94">PRIORITIZATION AND TIME MANAGEMENT</text>
  <text class="sub" x="40" y="116">Sort Before You Sprint</text>

  <rect class="mini" x="700" y="34" width="360" height="100"/>
  <text class="label" x="720" y="58">WHY THIS MATTERS</text>
  <rect class="mask2" x="720" y="70" width="320" height="10"/>
  <rect class="mask3" x="720" y="86" width="290" height="10"/>
  <rect class="mask2" x="720" y="102" width="260" height="10"/>

  <line class="line" x1="40" y1="140" x2="1060" y2="140"/>
  <text class="verb" x="470" y="175">TRIAGE</text>
  <line class="line" x1="40" y1="192" x2="1060" y2="192"/>

  <!-- T - Target Your List -->
  <rect class="box" x="40" y="205" width="320" height="180"/>
  <text class="letter" x="60" y="247">T</text>
  <text class="label" x="105" y="229">TARGET YOUR LIST</text>
  <rect class="mask1" x="105" y="240" width="240" height="10"/>
  <rect class="mask4" x="105" y="258" width="220" height="9"/>
  <text class="tiny" x="60" y="286" font-family="Arial" font-size="9" fill="#111111">1.</text><line class="fillline" x1="80" y1="286" x2="340" y2="286"/>
  <text class="tiny" x="60" y="306" font-family="Arial" font-size="9" fill="#111111">2.</text><line class="fillline" x1="80" y1="306" x2="340" y2="306"/>
  <text class="tiny" x="60" y="326" font-family="Arial" font-size="9" fill="#111111">3.</text><line class="fillline" x1="80" y1="326" x2="340" y2="326"/>
  <text class="tiny" x="60" y="346" font-family="Arial" font-size="9" fill="#111111">4.</text><line class="fillline" x1="80" y1="346" x2="340" y2="346"/>
  <text class="tiny" x="60" y="366" font-family="Arial" font-size="9" fill="#111111">5.</text><line class="fillline" x1="80" y1="366" x2="340" y2="366"/>

  <!-- R - Rank By Impact -->
  <rect class="box" x="400" y="205" width="320" height="180"/>
  <text class="letter" x="420" y="247">R</text>
  <text class="label" x="465" y="229">RANK BY IMPACT</text>
  <rect class="mask2" x="465" y="240" width="240" height="10"/>
  <rect class="mask3" x="465" y="258" width="200" height="9"/>
  <rect class="mask5" x="420" y="292" width="45" height="10"/><line class="fillline" x1="465" y1="300" x2="700" y2="300"/>
  <rect class="mask5" x="420" y="322" width="45" height="10"/><line class="fillline" x1="465" y1="330" x2="700" y2="330"/>
  <rect class="mask5" x="420" y="352" width="45" height="10"/><line class="fillline" x1="465" y1="360" x2="700" y2="360"/>

  <!-- I - Isolate What to Skip -->
  <rect class="box" x="760" y="205" width="320" height="180"/>
  <text class="letter" x="780" y="247">I</text>
  <text class="label" x="825" y="229">ISOLATE WHAT TO SKIP</text>
  <rect class="mask1" x="825" y="240" width="230" height="10"/>
  <rect class="mask4" x="825" y="258" width="220" height="9"/>
  <text class="tiny" x="780" y="286" font-family="Arial" font-size="9" fill="#111111">1.</text><line class="fillline" x1="800" y1="286" x2="1060" y2="286"/>
  <text class="tiny" x="780" y="306" font-family="Arial" font-size="9" fill="#111111">2.</text><line class="fillline" x1="800" y1="306" x2="1060" y2="306"/>
  <text class="tiny" x="780" y="326" font-family="Arial" font-size="9" fill="#111111">3.</text><line class="fillline" x1="800" y1="326" x2="1060" y2="326"/>
  <text class="tiny" x="780" y="346" font-family="Arial" font-size="9" fill="#111111">4.</text><line class="fillline" x1="800" y1="346" x2="1060" y2="346"/>

  <!-- A - Allocate Prime Time -->
  <rect class="box" x="40" y="400" width="320" height="180"/>
  <text class="letter" x="60" y="442">A</text>
  <text class="label" x="105" y="424">ALLOCATE PRIME TIME</text>
  <rect class="mask2" x="105" y="435" width="240" height="10"/>
  <rect class="mask3" x="105" y="453" width="180" height="9"/>
  <rect class="mask5" x="60" y="482" width="30" height="10"/><line class="fillline" x1="80" y1="490" x2="200" y2="490"/>
  <rect class="mask5" x="205" y="482" width="35" height="10"/><line class="fillline" x1="235" y1="490" x2="340" y2="490"/>
  <rect class="mask5" x="60" y="512" width="30" height="10"/><line class="fillline" x1="80" y1="520" x2="200" y2="520"/>
  <rect class="mask5" x="205" y="512" width="35" height="10"/><line class="fillline" x1="235" y1="520" x2="340" y2="520"/>
  <rect class="mask5" x="60" y="542" width="30" height="10"/><line class="fillline" x1="80" y1="550" x2="200" y2="550"/>
  <rect class="mask5" x="205" y="542" width="35" height="10"/><line class="fillline" x1="235" y1="550" x2="340" y2="550"/>

  <!-- G - Guard Your Focus -->
  <rect class="box" x="400" y="400" width="320" height="180"/>
  <text class="letter" x="420" y="442">G</text>
  <text class="label" x="465" y="424">GUARD YOUR FOCUS</text>
  <rect class="mask1" x="465" y="435" width="220" height="10"/>
  <rect class="mask4" x="465" y="453" width="230" height="9"/>
  <rect class="mask5" x="420" y="482" width="75" height="10"/><line class="fillline" x1="550" y1="490" x2="700" y2="490"/>
  <rect class="mask5" x="420" y="512" width="75" height="10"/><line class="fillline" x1="550" y1="520" x2="700" y2="520"/>
  <rect class="mask5" x="420" y="542" width="95" height="10"/><line class="fillline" x1="550" y1="550" x2="700" y2="550"/>

  <!-- E - Evaluate and Reset -->
  <rect class="box" x="760" y="400" width="320" height="180"/>
  <text class="letter" x="780" y="442">E</text>
  <text class="label" x="825" y="424">EVALUATE AND RESET</text>
  <rect class="mask2" x="825" y="435" width="220" height="10"/>
  <rect class="mask3" x="825" y="453" width="210" height="9"/>
  <rect class="mask5" x="780" y="482" width="80" height="10"/><line class="fillline" x1="900" y1="490" x2="1060" y2="490"/>
  <rect class="mask5" x="780" y="512" width="100" height="10"/><line class="fillline" x1="920" y1="520" x2="1060" y2="520"/>
  <rect class="mask5" x="780" y="542" width="120" height="10"/><line class="fillline" x1="940" y1="550" x2="1060" y2="550"/>

  <rect class="mini" x="40" y="595" width="1020" height="65"/>
  <text class="label" x="60" y="618">FINAL COMMAND</text>
  <rect class="mask1" x="60" y="630" width="620" height="10"/>
  <line class="fillline" x1="60" y1="652" x2="1030" y2="652"/>

  <rect class="mini" x="40" y="675" width="315" height="145"/>
  <text class="num" x="60" y="710">1</text>
  <text class="label" x="95" y="698">SORT</text>
  <rect class="mask2" x="95" y="710" width="200" height="9"/>
  <rect class="mask3" x="95" y="726" width="200" height="9"/>
  <line class="fillline" x1="60" y1="752" x2="340" y2="752"/>
  <line class="fillline" x1="60" y1="776" x2="340" y2="776"/>

  <rect class="mini" x="392" y="675" width="315" height="145"/>
  <text class="num" x="412" y="710">2</text>
  <text class="label" x="447" y="698">SCHEDULE</text>
  <rect class="mask2" x="447" y="710" width="200" height="9"/>
  <rect class="mask3" x="447" y="726" width="200" height="9"/>
  <line class="fillline" x1="412" y1="752" x2="692" y2="752"/>
  <line class="fillline" x1="412" y1="776" x2="692" y2="776"/>

  <rect class="mini" x="745" y="675" width="315" height="145"/>
  <text class="num" x="765" y="710">3</text>
  <text class="label" x="800" y="698">PROTECT &amp; REVIEW</text>
  <rect class="mask2" x="800" y="710" width="200" height="9"/>
  <rect class="mask3" x="800" y="726" width="200" height="9"/>
  <line class="fillline" x1="765" y1="752" x2="1045" y2="752"/>
  <line class="fillline" x1="765" y1="776" x2="1045" y2="776"/>
</svg>