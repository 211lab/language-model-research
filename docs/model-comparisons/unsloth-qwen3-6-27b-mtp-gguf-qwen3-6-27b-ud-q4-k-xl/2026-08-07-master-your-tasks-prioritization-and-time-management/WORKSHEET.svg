<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the FOCUS action model, and a summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">THE SHIFT</text>
  <text class="small" x="720" y="78">Stop reacting to noise. Start creating signal.</text>
  <text class="small" x="720" y="94">You are not busy. You are scattered.</text>

  <text class="verb" x="444" y="142">FOCUS</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <!-- F - Filter Your List -->
  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">F</text>
  <text class="label" x="105" y="204">FILTER YOUR LIST</text>
  <text class="small" x="105" y="224">Brain dump everything. Pick 3 A-tasks.</text>
  <text class="tiny" x="105" y="242">If it doesn't move the needle, it waits.</text>
  <text class="tiny" x="60" y="268">1.</text><line class="fillline" x1="80" y1="268" x2="330" y2="268"/>
  <text class="tiny" x="60" y="292">2.</text><line class="fillline" x1="80" y1="292" x2="330" y2="292"/>
  <text class="tiny" x="60" y="316">3.</text><line class="fillline" x1="80" y1="316" x2="330" y2="316"/>
  <text class="tiny" x="60" y="340">4.</text><line class="fillline" x1="80" y1="340" x2="330" y2="340"/>

  <!-- O - Order Your Day -->
  <rect class="box" x="390" y="180" width="320" height="185"/>
  <text class="letter" x="410" y="222">O</text>
  <text class="label" x="455" y="204">ORDER YOUR DAY</text>
  <text class="small" x="455" y="224">Schedule A-tasks in peak energy blocks.</text>
  <text class="tiny" x="455" y="242">Treat these blocks like sacred meetings.</text>
  <text class="tiny" x="410" y="268">Task 1:</text><line class="fillline" x1="465" y1="268" x2="680" y2="268"/>
  <text class="tiny" x="410" y="292">Time:</text><line class="fillline" x1="465" y1="292" x2="680" y2="292"/>
  <text class="tiny" x="410" y="316">Task 2:</text><line class="fillline" x1="465" y1="316" x2="680" y2="316"/>
  <text class="tiny" x="410" y="340">Time:</text><line class="fillline" x1="465" y1="340" x2="680" y2="340"/>

  <!-- C - Cut Distractions -->
  <rect class="box" x="740" y="180" width="320" height="185"/>
  <text class="letter" x="760" y="222">C</text>
  <text class="label" x="805" y="204">CUT DISTRACTIONS</text>
  <text class="small" x="805" y="224">Identify top 3 distractions and eliminate.</text>
  <text class="tiny" x="805" y="242">Phone away. Tabs closed. Status set.</text>
  <text class="tiny" x="760" y="268">1.</text><line class="fillline" x1="780" y1="268" x2="1030" y2="268"/>
  <text class="tiny" x="760" y="292">2.</text><line class="fillline" x1="780" y1="292" x2="1030" y2="292"/>
  <text class="tiny" x="760" y="316">3.</text><line class="fillline" x1="780" y1="316" x2="1030" y2="316"/>
  <text class="tiny