[context]
title = "Master Your Tasks: Prioritization and Time Management"
slug = "master-your-tasks-prioritization-and-time-management"
date = "2026-08-07"
target_dir = "docs/model-comparisons/openai-gpt-5-6-luna/2026-08-07-master-your-tasks-prioritization-and-time-management"

[providers.text]
kind = "openrouter"
providerUrl = "https://openrouter.ai/api/v1"
model = "openai/gpt-5.6-luna"
timeout_seconds = 900
retry_attempts = 4
retry_wait_seconds = 75

[providers.image]
kind = "openrouter"
providerUrl = "https://openrouter.ai/api/v1"
model = "openai/gpt-5.4-image-2"
timeout_seconds = 900
retry_attempts = 4
retry_wait_seconds = 75

[providers.audio]
kind = "openai-compatible"
providerUrl = "http://localhost:11434"
model = "AUDIO_MODEL_NAME"

[variables]
voice = "direct, pragmatic, masculine, concrete"
audience = "men who need structure, ownership, and steady action"

[tracks]
promo_assets = false
landing_page = false

