<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, choice box, fillable sections built around the TRIAGE action model for prioritization and time management, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="660" y="30" width="400" height="82"/>
  <text class="label" x="678" y="52">T — TALLY EVERYTHING (START HERE)</text>
  <text class="small" x="678" y="70">Dump all seven days of tasks in one place. No sorting.</text>
  <text class="small" x="678" y="86">Sweep phone notes, flagged email, tickets, sticky notes.</text>
  <text class="tiny" x="678" y="104">Total items counted:</text>
  <line class="fillline" x1="770" y1="104" x2="880" y2="104"/>
  <text class="tiny" x="890" y="104">Storage spots swept:</text>
  <line class="fillline" x1="985" y1="104" x2="1040" y2="104"/>

  <text class="verb" x="440" y="142">TRIAGE</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="172" width="490" height="196"/>
  <text class="letter" x="60" y="214">T</text>
  <text class="label" x="104" y="196">TALLY — THE FULL DUMP</text>
  <text class="small" x="104" y="215">Write every task, work and home, one line each.</text>
  <text class="tiny" x="104" y="232">Include the one you have been avoiding. Ugly is correct.</text>
  <text class="tiny" x="60" y="258">1.</text><line class="fillline" x1="80" y1="258" x2="285" y2="258"/>
  <text class="tiny" x="300" y="258">7.</text><line class="fillline" x1="320" y1="258" x2="512" y2="258"/>
  <text class="tiny" x="60" y="282">2.</text><line class="fillline" x1="80" y1="282" x2="285" y2="282"/>
  <text class="tiny" x="300" y="282">8.</text><line class="fillline" x1="320" y1="282" x2="512" y2="282"/>
  <text class="tiny" x="60" y="306">3.</text><line class="fillline" x1="80" y1="306" x2="285" y2="306"/>
  <text class="tiny" x="300" y="306">9.</text><line class="fillline" x1="320" y1="306" x2="512" y2="306"/>
  <text class="tiny" x="60" y="330">4.</text><line class="fillline" x1="80" y1="330" x2="285" y2="330"/>
  <text class="tiny" x="298" y="330">10.</text><line class="fillline" x1="322" y1="330" x2="512" y2="330"/>
  <text class="tiny" x="60" y="354">5.</text><line class="fillline" x1="80" y1="354" x2="285" y2="354"/>
  <text class="tiny" x="298" y="354">11.</text><line class="fillline" x1="322" y1="354" x2="512" y2="354"/>

  <rect class="box" x="550" y="172" width="510" height="196"/>
  <text class="letter" x="570" y="214">R</text>
  <text class="label" x="614" y="196">RANK BY IMPACT, NOT BY NOISE</text>
  <text class="small" x="614" y="215">Only three A's. B gets a date. C is somebody else's agenda.</text>
  <text class="tiny" x="614" y="232">Ask: if only three got done, which move me farthest?</text>
  <text class="tiny" x="570" y="258">A-1</text><line class="fillline" x1="596" y1="258" x2="1040" y2="258"/>
  <text class="tiny" x="570" y="282">A-2</text><line class="fillline" x1="596" y1="282" x2="1040" y2="282"/>
  <text class="tiny" x="570" y="306">A-3</text><line class="fillline" x1="596" y1="306" x2="1040" y2="306"/>
  <text class="tiny" x="570" y="332">B + date</text><line class="fillline" x1="618" y1="332" x2="1040" y2="332"/>
  <text class="tiny" x="570" y="356">C / not mine</text><line class="fillline" x1="640" y1="356" x2="1040" y2="356"/>

  <rect class="box" x="40" y="382" width="490" height="196"/>
  <text class="letter" x="60" y="424">I</text>
  <text class="label" x="104" y="406">ISOLATE WHAT YOU WON'T DO</text>
  <text class="small" x="104" y="425">Every leftover gets Delay, Delegate, or Delete.</text>
  <text class="tiny" x="104" y="442">Delay needs a date. Delegate needs a name. Delete gets said aloud.</text>
  <text class="tiny" x="60" y="468">Delay — item + day/time:</text><line class="fillline" x1="172" y1="468" x2="512" y2="468"/>
  <text class="tiny" x="60" y="492">Delegate — item + name:</text><line class="fillline" x1="172" y1="492" x2="512" y2="492"/>
  <text class="tiny" x="60" y="516">Delete — not happening:</text><line class="fillline" x1="172" y1="516" x2="512" y2="516"/>
  <text class="tiny" x="60" y="540">Fossil (3+ wks) first 20-min step:</text><line class="fillline" x1="206" y1="540" x2="512" y2="540"/>
  <text class="tiny" x="60" y="564">The one uncomfortable message, verbatim:</text><line class="fillline" x1="252" y1="564" x2="512" y2="564"/>

  <rect class="box" x="550" y="382" width="510" height="196"/>
  <text class="letter" x="570" y="424">A</text>
  <text class="label" x="614" y="406">ASSIGN PRIME TIME TO THE A-LIST</text>
  <text class="small" x="614" y="425">Named blocks with start times. A ranking with no clock is an opinion.</text>
  <text class="tiny" x="614" y="442">A-1 in your two highest-energy hours, 60 to 90 minutes.</text>
  <text class="tiny" x="570" y="468">A-1 block</text><line class="fillline" x1="626" y1="468" x2="1040" y2="468"/>
  <text class="tiny" x="570" y="492">A-2 block</text><line class="fillline" x1="626" y1="492" x2="1040" y2="492"/>
  <text class="tiny" x="570" y="516">A-3 block</text><line class="fillline" x1="626" y1="516" x2="1040" y2="516"/>
  <text class="tiny" x="570" y="540">B window</text><line class="fillline" x1="626" y1="540" x2="795" y2="540"/>
  <text class="tiny" x="806" y="540">C batch</text><line class="fillline" x1="848" y1="540" x2="1040" y2="540"/>
  <text class="tiny" x="570" y="564">Messages only at</text><line class="fillline" x1="656" y1="564" x2="795" y2="564"/>
  <text class="tiny" x="806" y="564">Defended slot</text><line class="fillline" x1="878" y1="564" x2="1040" y2="564"/>

  <rect class="box" x="40" y="592" width="490" height="150"/>
  <text class="letter" x="60" y="634">G</text>
  <text class="label" x="104" y="616">GUARD THE BLOCK</text>
  <text class="small" x="104" y="635">Write the setup and interruption protocol before you need it.</text>
  <text class="tiny" x="60" y="662">Phone goes:</text><line class="fillline" x1="126" y1="662" x2="512" y2="662"/>
  <text class="tiny" x="60" y="686">Heads-up to (name + exact sentence):</text><line class="fillline" x1="232" y1="686" x2="512" y2="686"/>
  <text class="tiny" x="60" y="710">Sprints (25 on / 5 up):</text><line class="fillline" x1="164" y1="710" x2="512" y2="710"/>
  <text class="tiny" x="60" y="734">Capture pad — what and where:</text><line class="fillline" x1="204" y1="734" x2="440" y2="734"/>
  <rect class="mini" x="452" y="720" width="20" height="18"/>
  <rect class="mini" x="478" y="720" width="20" height="18"/>
  <text class="tiny" x="452" y="712">A-1 checked by hand</text>

  <rect class="box" x="550" y="592" width="510" height="150"/>
  <text class="letter" x="570" y="634">E</text>
  <text class="label" x="614" y="616">EVALUATE AND RESET FOR TOMORROW</text>
  <text class="small" x="614" y="635">Five written minutes at day's end. Re-rank, never copy.</text>
  <text class="tiny" x="570" y="662">A-tasks finished today:</text><line class="fillline" x1="678" y1="662" x2="1040" y2="662"/>
  <text class="tiny" x="570" y="686">What pulled me off, and when:</text><line class="fillline" x1="708" y1="686" x2="1040" y2="686"/>
  <text class="tiny" x="570" y="710">Repeat offender — demote, delete, or cut first step:</text><line class="fillline" x1="784" y1="710" x2="1040" y2="710"/>
  <text class="tiny" x="570" y="734">Tomorrow's three, re-ranked:</text><line class="fillline" x1="700" y1="734" x2="1040" y2="734"/>

  <rect class="mini" x="40" y="756" width="1020" height="62"/>
  <text class="label" x="60" y="778">FINISH IT TONIGHT</text>
  <text class="small" x="60" y="796">Three A's written, every leftover marked, the message sent, A-1 on the calendar at a fixed time. Night 1 of 7 done:</text>
  <line class="fillline" x1="700" y1="796" x2="860" y2="796"/>
  <text class="tiny" x="872" y="796">A-tasks finished this week (target 15–21):</text>
  <line class="fillline" x1="1010" y1="796" x2="1040" y2="796"/>
  <text class="tiny" x="60" y="812">1 TALLY then RANK — one page, three A's.   2 ISOLATE then ASSIGN — a date, a name, or a deletion; then a start time.   3 GUARD then EVALUATE — protect the block, log the proof.</text>
</svg>