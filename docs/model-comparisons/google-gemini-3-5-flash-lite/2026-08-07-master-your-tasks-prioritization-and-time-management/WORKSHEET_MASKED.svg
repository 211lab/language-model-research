<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the SHIELD action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .mask-light { fill: #f2f2f2; rx: 3; ry: 3; }
      .mask-mid { fill: #e6e6e6; rx: 3; ry: 3; }
      .mask-dark { fill: #d9d9d9; rx: 3; ry: 3; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="68">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="92">Prioritization and Time Management</text>

  <rect class="mini" x="660" y="30" width="400" height="76"/>
  <text class="label" x="680" y="52">THE REALITY</text>
  <rect class="mask-light" x="680" y="60" width="345" height="12" />
  <rect class="mask-mid" x="680" y="76" width="365" height="12" />

  <text class="verb" x="480" y="136">SHIELD</text>
  <line class="line" x1="40" y1="146" x2="1060" y2="146"/>

  <!-- Row 1: S, H, I -->
  <rect class="box" x="40" y="166" width="320" height="195"/>
  <text class="letter" x="60" y="208">S</text>
  <text class="label" x="105" y="190">1. SORT THE BIG ROCKS</text>
  <rect class="mask-light" x="105" y="200" width="220" height="12" />
  <rect class="mask-mid" x="105" y="216" width="160" height="10" />
  <text class="tiny" x="60" y="254">1.</text><line class="fillline" x1="80" y1="254" x2="330" y2="254"/><rect class="mask-light" x="85" y="244" width="230" height="8" />
  <text class="tiny" x="60" y="286">2.</text><line class="fillline" x1="80" y1="286" x2="330" y2="286"/><rect class="mask-mid" x="85" y="276" width="200" height="8" />
  <text class="tiny" x="60" y="318">3.</text><line class="fillline" x1="80" y1="318" x2="330" y2="318"/><rect class="mask-light" x="85" y="308" width="215" height="8" />
  <text class="tiny" x="60" y="346">Noise to cut:</text><line class="fillline" x1="130" y1="346" x2="330" y2="346"/><rect class="mask-dark" x="135" y="336" width="180" height="8" />

  <rect class="box" x="390" y="166" width="320" height="195"/>
  <text class="letter" x="410" y="208">H</text>
  <text class="label" x="455" y="190">2. HARNESS PRIME HOURS</text>
  <rect class="mask-light" x="455" y="200" width="210" height="12" />
  <rect class="mask-mid" x="455" y="216" width="230" height="10" />
  <text class="tiny" x="410" y="254">Time Slot:</text><line class="fillline" x1="475" y1="254" x2="680" y2="254"/><rect class="mask-mid" x="480" y="244" width="185" height="8" />
  <text class="tiny" x="410" y="286">Target:</text><line class="fillline" x1="475" y1="286" x2="680" y2="286"/><rect class="mask-light" x="480" y="276" width="190" height="8" />
  <line class="fillline" x1="410" y1="318" x2="680" y2="318"/><rect class="mask-dark" x="415" y="308" width="255" height="8" />
  <line class="fillline" x1="410" y1="346" x2="680" y2="346"/><rect class="mask-light" x="415" y="336" width="240" height="8" />

  <rect class="box" x="740" y="166" width="320" height="195"/>
  <text class="letter" x="760" y="208">I</text>
  <text class="label" x="805" y="190">3. ISOLATE YOUR FOCUS</text>
  <rect class="mask-light" x="805" y="200" width="205" height="12" />
  <rect class="mask-mid" x="805" y="216" width="235" height="10" />
  <text class="tiny" x="760" y="254">Alerts silenced?</text><line class="fillline" x1="855" y1="254" x2="1030" y2="254"/><rect class="mask-dark" x="860" y="244" width="155" height="8" />
  <text class="tiny" x="760" y="286">Tabs closed?</text><line class="fillline" x1="840" y1="286" x2="1030" y2="286"/><rect class="mask-light" x="845" y="276" width="170" height="8" />
  <text class="tiny" x="760" y="318">Boundary set?</text><line class="fillline" x1="850" y1="318" x2="1030" y2="318"/><rect class="mask-mid" x="855" y="308" width="160" height="8" />
  <line class="fillline" x1="760" y1="346" x2="1030" y2="346"/><rect class="mask-dark" x="765" y="336" width="250" height="8" />

  <!-- Row 2: E, L, D -->
  <rect class="box" x="40" y="380" width="320" height="195"/>
  <text class="letter" x="60" y="422">E</text>
  <text class="label" x="105" y="404">4. EXECUTE IN SPRINTS</text>
  <rect class="mask-light" x="105" y="414" width="210" height="12" />
  <rect class="mask-mid" x="105" y="430" width="225" height="10" />
  <text class="tiny" x="60" y="468">Sprint Duration:</text><line class="fillline" x1="145" y1="468" x2="330" y2="468"/><rect class="mask-dark" x="150" y="458" width="165" height="8" />
  <text class="tiny" x="60" y="500">First Action:</text><line class="fillline" x1="135" y1="500" x2="330" y2="500"/><rect class="mask-light" x="140" y="490" width="180" height="8" />
  <line class="fillline" x1="60" y1="530" x2="330" y2="530"/><rect class="mask-mid" x="65" y="520" width="255" height="8" />
  <line class="fillline" x1="60" y1="558" x2="330" y2="558"/><rect class="mask-dark" x="65" y="548" width="240" height="8" />

  <rect class="box" x="390" y="380" width="320" height="195"/>
  <text class="letter" x="410" y="422">L</text>
  <text class="label" x="455" y="404">5. LOCK &amp; REVIEW</text>
  <rect class="mask-light" x="455" y="414" width="210" height="12" />
  <rect class="mask-mid" x="455" y="430" width="240" height="10" />
  <text class="tiny" x="410" y="468">Completed:</text><line class="fillline" x1="475" y1="468" x2="680" y2="468"/><rect class="mask-mid" x="480" y="458" width="185" height="8" />
  <text class="tiny" x="410" y="500">Rollover/Cut:</text><line class="fillline" x1="485" y1="500" x2="680" y2="500"/><rect class="mask-light" x="490" y="490" width="175" height="8" />
  <line class="fillline" x1="410" y1="530" x2="680" y2="530"/><rect class="mask-dark" x="415" y="520" width="250" height="8" />
  <line class="fillline" x1="410" y1="558" x2="680" y2="558"/><rect class="mask-light" x="415" y="548" width="230" height="8" />

  <rect class="box" x="740" y="380" width="320" height="195"/>
  <text class="letter" x="760" y="422">D</text>
  <text class="label" x="805" y="404">6. DEFEND THE AFTERNOON</text>
  <rect class="mask-light" x="805" y="414" width="200" height="12" />
  <rect class="mask-mid" x="805" y="430" width="215" height="10" />
  <text class="tiny" x="760" y="468">Potential Trap:</text><line class="fillline" x1="845" y1="468" x2="1030" y2="468"/><rect class="mask-dark" x="850" y="458" width="165" height="8" />
  <text class="tiny" x="760" y="500">My Firm NO:</text><line class="fillline" x1="840" y1="500" x2="1030" y2="500"/><rect class="mask-light" x="845" y="490" width="170" height="8" />
  <line class="fillline" x1="760" y1="530" x2="1030" y2="530"/><rect class="mask-mid" x="765" y="520" width="250" height="8" />
  <line class="fillline" x1="760" y1="558" x2="1030" y2="558"/><rect class="mask-dark" x="765" y="548" width="235" height="8" />

  <!-- Footer block 1: Final Command -->
  <rect class="mini" x="40" y="595" width="1020" height="78"/>
  <text class="label" x="60" y="618">FINAL COMMAND</text>
  <rect class="mask-light" x="60" y="628" width="510" height="12" />
  <line class="fillline" x1="60" y1="658" x2="1030" y2="658"/><rect class="mask-mid" x="65" y="646" width="950" height="8" />

  <!-- Footer block 2: Three Step Summary Footer -->
  <rect class="mini" x="40" y="690" width="315" height="120"/>
  <text class="num" x="60" y="724">1</text>
  <text class="label" x="95" y="712">SORT &amp; TIME-BLOCK</text>
  <rect class="mask-light" x="95" y="720" width="210" height="10" />
  <rect class="mask-mid" x="95" y="736" width="225" height="10" />
  <rect class="mask-dark" x="95" y="752" width="230" height="10" />
  <line class="fillline" x1="60" y1="786" x2="315" y2="786"/><rect class="mask-light" x="65" y="774" width="235" height="8" />

  <rect class="mini" x="392" y="690" width="315" height="120"/>
  <text class="num" x="412" y="724">2</text>
  <text class="label" x="447" y="712">ISOLATE &amp; EXECUTE</text>
  <rect class="mask-mid" x="447" y="720" width="225" height="10" />
  <rect class="mask-light" x="447" y="736" width="200" height="10" />
  <rect class="mask-dark" x="447" y="752" width="215" height="10" />
  <line class="fillline" x1="412" y1="786" x2="667" y2="786"/><rect class="mask-mid" x="417" y="774" width="235" height="8" />

  <rect class="mini" x="745" y="690" width="315" height="120"/>
  <text class="num" x="765" y="724">3</text>
  <text class="label" x="800" y="712">LOCK &amp; DEFEND</text>
  <rect class="mask-dark" x="800" y="720" width="220" height="10" />
  <rect class="mask-light" x="800" y="736" width="190" height="10" />
  <rect class="mask-mid" x="800" y="752" width="205" height="10" />
  <line class="fillline" x1="765" y1="786" x2="1020" y2="786"/><rect class="mask-dark" x="770" y="774" width="235" height="8" />
</svg>