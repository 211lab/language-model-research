<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the SHIELD action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="68">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="92">Prioritization and Time Management</text>

  <rect class="mini" x="660" y="30" width="400" height="76"/>
  <text class="label" x="680" y="52">THE REALITY</text>
  <text class="small" x="680" y="70">Stop reacting to loud requests and endless low-value chores.</text>
  <text class="small" x="680" y="86">Lock your focus onto the heavy tasks that move your life forward.</text>

  <text class="verb" x="480" y="136">SHIELD</text>
  <line class="line" x1="40" y1="146" x2="1060" y2="146"/>

  <!-- Row 1: S, H, I -->
  <rect class="box" x="40" y="166" width="320" height="195"/>
  <text class="letter" x="60" y="208">S</text>
  <text class="label" x="105" y="190">1. SORT THE BIG ROCKS</text>
  <text class="small" x="105" y="210">Dump tasks out and pick top 3 big rocks.</text>
  <text class="tiny" x="105" y="226">Leave minor noise behind.</text>
  <text class="tiny" x="60" y="254">1.</text><line class="fillline" x1="80" y1="254" x2="330" y2="254"/>
  <text class="tiny" x="60" y="286">2.</text><line class="fillline" x1="80" y1="286" x2="330" y2="286"/>
  <text class="tiny" x="60" y="318">3.</text><line class="fillline" x1="80" y1="318" x2="330" y2="318"/>
  <text class="tiny" x="60" y="346">Noise to cut:</text><line class="fillline" x1="130" y1="346" x2="330" y2="346"/>

  <rect class="box" x="390" y="166" width="320" height="195"/>
  <text class="letter" x="410" y="208">H</text>
  <text class="label" x="455" y="190">2. HARNESS PRIME HOURS</text>
  <text class="small" x="455" y="210">Block morning hours for top priorities.</text>
  <text class="tiny" x="455" y="226">Treat blocks like unmissable appointments.</text>
  <text class="tiny" x="410" y="254">Time Slot:</text><line class="fillline" x1="475" y1="254" x2="680" y2="254"/>
  <text class="tiny" x="410" y="286">Target:</text><line class="fillline" x1="475" y1="286" x2="680" y2="286"/>
  <line class="fillline" x1="410" y1="318" x2="680" y2="318"/>
  <line class="fillline" x1="410" y1="346" x2="680" y2="346"/>

  <rect class="box" x="740" y="166" width="320" height="195"/>
  <text class="letter" x="760" y="208">I</text>
  <text class="label" x="805" y="190">3. ISOLATE YOUR FOCUS</text>
  <text class="small" x="805" y="210">Kill alerts, close tabs, set boundaries.</text>
  <text class="tiny" x="805" y="226">Enter deep focus mode with zero distraction.</text>
  <text class="tiny" x="760" y="254">Alerts silenced?</text><line class="fillline" x1="855" y1="254" x2="1030" y2="254"/>
  <text class="tiny" x="760" y="286">Tabs closed?</text><line class="fillline" x1="840" y1="286" x2="1030" y2="286"/>
  <text class="tiny" x="760" y="318">Boundary set?</text><line class="fillline" x1="850" y1="318" x2="1030" y2="318"/>
  <line class="fillline" x1="760" y1="346" x2="1030" y2="346"/>

  <!-- Row 2: E, L, D -->
  <rect class="box" x="40" y="380" width="320" height="195"/>
  <text class="letter" x="60" y="422">E</text>
  <text class="label" x="105" y="404">4. EXECUTE IN SPRINTS</text>
  <text class="small" x="105" y="424">Dive in instantly without hesitation.</text>
  <text class="tiny" x="105" y="440">Work through timed sprints until done.</text>
  <text class="tiny" x="60" y="468">Sprint Duration:</text><line class="fillline" x1="145" y1="468" x2="330" y2="468"/>
  <text class="tiny" x="60" y="500">First Action:</text><line class="fillline" x1="135" y1="500" x2="330" y2="500"/>
  <line class="fillline" x1="60" y1="530" x2="330" y2="530"/>
  <line class="fillline" x1="60" y1="558" x2="330" y2="558"/>

  <rect class="box" x="390" y="380" width="320" height="195"/>
  <text class="letter" x="410" y="422">L</text>
  <text class="label" x="455" y="404">5. LOCK &amp; REVIEW</text>
  <text class="small" x="455" y="424">Check off completed items and wins.</text>
  <text class="tiny" x="455" y="440">Delegate, cut, or rollover remaining tasks.</text>
  <text class="tiny" x="410" y="468">Completed:</text><line class="fillline" x1="475" y1="468" x2="680" y2="468"/>
  <text class="tiny" x="410" y="500">Rollover/Cut:</text><line class="fillline" x1="485" y1="500" x2="680" y2="500"/>
  <line class="fillline" x1="410" y1="530" x2="680" y2="530"/>
  <line class="fillline" x1="410" y1="558" x2="680" y2="558"/>

  <rect class="box" x="740" y="380" width="320" height="195"/>
  <text class="letter" x="760" y="422">D</text>
  <text class="label" x="805" y="404">6. DEFEND THE AFTERNOON</text>
  <text class="small" x="805" y="424">Say no firmly to low-value requests.</text>
  <text class="tiny" x="805" y="440">Protect energy and your daily plan.</text>
  <text class="tiny" x="760" y="468">Potential Trap:</text><line class="fillline" x1="845" y1="468" x2="1030" y2="468"/>
  <text class="tiny" x="760" y="500">My Firm NO:</text><line class="fillline" x1="840" y1="500" x2="1030" y2="500"/>
  <line class="fillline" x1="760" y1="530" x2="1030" y2="530"/>
  <line class="fillline" x1="760" y1="558" x2="1030" y2="558"/>

  <!-- Footer block 1: Final Command -->
  <rect class="mini" x="40" y="595" width="1020" height="78"/>
  <text class="label" x="60" y="618">FINAL COMMAND</text>
  <text class="small" x="60" y="638">My locked calendar commitment and daily protection boundary is:</text>
  <line class="fillline" x1="60" y1="658" x2="1030" y2="658"/>

  <!-- Footer block 2: Three Step Summary Footer -->
  <rect class="mini" x="40" y="690" width="315" height="120"/>
  <text class="num" x="60" y="724">1</text>
  <text class="label" x="95" y="712">SORT &amp; TIME-BLOCK</text>
  <text class="tiny" x="95" y="730">Pick top 3 big rocks immediately.</text>
  <text class="tiny" x="95" y="746">Lock them into high-energy morning hours.</text>
  <text class="tiny" x="95" y="762">Treat focus blocks as sacred appointments.</text>
  <line class="fillline" x1="60" y1="786" x2="315" y2="786"/>

  <rect class="mini" x="392" y="690" width="315" height="120"/>
  <text class="num" x="412" y="724">2</text>
  <text class="label" x="447" y="712">ISOLATE &amp; EXECUTE</text>
  <text class="tiny" x="447" y="730">Eliminate alerts, tabs, and interruptions.</text>
  <text class="tiny" x="447" y="746">Dive straight into priority sprints.</text>
  <text class="tiny" x="447" y="762">Work without hesitation until complete.</text>
  <line class="fillline" x1="412" y1="786" x2="667" y2="786"/>

  <rect class="mini" x="745" y="690" width="315" height="120"/>
  <text class="num" x="765" y="724">3</text>
  <text class="label" x="800" y="712">LOCK &amp; DEFEND</text>
  <text class="tiny" x="800" y="730">Review wins and rollover unfinished tasks.</text>
  <text class="tiny" x="800" y="746">Stand firm against afternoon noise.</text>
  <text class="tiny" x="800" y="762">Stop negotiating with distractions.</text>
  <line class="fillline" x1="765" y1="786" x2="1020" y2="786"/>
</svg>