<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape printable worksheet on a white background with a large title, the TRIAGE process, six actionable fillable sections, and a seven-day priority completion tracker.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="30">SBXX</text>
  <text class="title" x="40" y="61">MASTER YOUR TASKS:</text>
  <text class="title" x="40" y="91">PRIORITIZATION AND TIME MANAGEMENT</text>
  <text class="sub" x="40" y="118">Decide what matters, protect the time, and reset daily.</text>

  <rect class="mini" x="755" y="30" width="305" height="92"/>
  <text class="label" x="775" y="53">7-DAY TARGET</text>
  <text class="small" x="775" y="73">Complete your top three on at least 5 of 7 days.</text>
  <text class="tiny" x="775" y="92">No working late, skipped breaks, or dropped</text>
  <text class="tiny" x="775" y="106">family duties.</text>

  <text class="verb" x="469" y="157">TRIAGE</text>
  <line class="line" x1="40" y1="169" x2="1060" y2="169"/>

  <rect class="box" x="40" y="184" width="320" height="215"/>
  <text class="letter" x="60" y="225">T</text>
  <text class="label" x="105" y="207">TRANSFER EVERY TASK</text>
  <text class="small" x="105" y="227">Capture every open commitment in one trusted list.</text>
  <text class="tiny" x="105" y="244">Use a concrete action verb. Do not rank yet.</text>
  <text class="tiny" x="60" y="269">1.</text><line class="fillline" x1="78" y1="269" x2="330" y2="269"/>
  <text class="tiny" x="60" y="293">2.</text><line class="fillline" x1="78" y1="293" x2="330" y2="293"/>
  <text class="tiny" x="60" y="317">3.</text><line class="fillline" x1="78" y1="317" x2="330" y2="317"/>
  <text class="tiny" x="60" y="341">4.</text><line class="fillline" x1="78" y1="341" x2="330" y2="341"/>
  <text class="tiny" x="60" y="365">5.</text><line class="fillline" x1="78" y1="365" x2="330" y2="365"/>
  <text class="tiny" x="60" y="389">6.</text><line class="fillline" x1="78" y1="389" x2="330" y2="389"/>

  <rect class="box" x="390" y="184" width="320" height="215"/>
  <text class="letter" x="410" y="225">R</text>
  <text class="label" x="455" y="207">RANK BY IMPACT AND URGENCY</text>
  <text class="small" x="455" y="227">Choose exactly three tasks with the biggest result.</text>
  <text class="tiny" x="455" y="244">State the consequence, deadline, or duty each protects.</text>
  <text class="tiny" x="410" y="267">1. TASK</text>
  <line class="fillline" x1="454" y1="267" x2="680" y2="267"/>
  <text class="tiny" x="425" y="285">WHY</text>
  <line class="fillline" x1="454" y1="285" x2="680" y2="285"/>
  <text class="tiny" x="410" y="310">2. TASK</text>
  <line class="fillline" x1="454" y1="310" x2="680" y2="310"/>
  <text class="tiny" x="425" y="328">WHY</text>
  <line class="fillline" x1="454" y1="328" x2="680" y2="328"/>
  <text class="tiny" x="410" y="353">3. TASK</text>
  <line class="fillline" x1="454" y1="353" x2="680" y2="353"/>
  <text class="tiny" x="425" y="371">WHY</text>
  <line class="fillline" x1="454" y1="371" x2="680" y2="371"/>
  <text class="tiny" x="410" y="390">Others: schedule • delegate • delay/delete</text>

  <rect class="box" x="740" y="184" width="320" height="215"/>
  <text class="letter" x="760" y="225">I</text>
  <text class="label" x="805" y="207">INSTALL PRIORITIES IN YOUR SCHEDULE</text>
  <text class="small" x="805" y="227">Reserve real blocks and define visible finish lines.</text>
  <text class="tiny" x="805" y="244">Match the hardest task to your strongest hours.</text>
  <text class="tiny" x="760" y="267">1</text>
  <text class="tiny" x="780" y="267">TIME</text><line class="fillline" x1="810" y1="267" x2="905" y2="267"/>
  <text class="tiny" x="916" y="267">FINISH</text><line class="fillline" x1="954" y1="267" x2="1030" y2="267"/>
  <text class="tiny" x="780" y="288">NEED / BOUNDARY</text><line class="fillline" x1="870" y1="288" x2="1030" y2="288"/>
  <text class="tiny" x="760" y="314">2</text>
  <text class="tiny" x="780" y="314">TIME</text><line class="fillline" x1="810" y1="314" x2="905" y2="314"/>
  <text class="tiny" x="916" y="314">FINISH</text><line class="fillline" x1="954" y1="314" x2="1030" y2="314"/>
  <text class="tiny" x="780" y="335">NEED / BOUNDARY</text><line class="fillline" x1="870" y1="335" x2="1030" y2="335"/>
  <text class="tiny" x="760" y="361">3</text>
  <text class="tiny" x="780" y="361">TIME</text><line class="fillline" x1="810" y1="361" x2="905" y2="361"/>
  <text class="tiny" x="916" y="361">FINISH</text><line class="fillline" x1="954" y1="361" x2="1030" y2="361"/>
  <text class="tiny" x="780" y="382">NEED / BOUNDARY</text><line class="fillline" x1="870" y1="382" x2="1030" y2="382"/>

  <rect class="box" x="40" y="419" width="320" height="215"/>
  <text class="letter" x="60" y="460">A</text>
  <text class="label" x="105" y="442">ATTACK ONE TASK AT A TIME</text>
  <text class="small" x="105" y="462">Create focus conditions before the block begins.</text>
  <text class="tiny" x="105" y="479">One task, one defined sprint, one interruption rule.</text>
  <text class="tiny" x="60" y="506">FIRST FOCUSED ACTION</text>
  <line class="fillline" x1="60" y1="524" x2="330" y2="524"/>
  <text class="tiny" x="60" y="548">SPRINT / BREAK</text>
  <line class="fillline" x1="145" y1="548" x2="330" y2="548"/>
  <text class="tiny" x="60" y="572">DISTRACTIONS I WILL REMOVE</text>
  <line class="fillline" x1="60" y1="590" x2="330" y2="590"/>
  <text class="tiny" x="60" y="614">IF INTERRUPTED, I WILL</text>
  <line class="fillline" x1="181" y1="614" x2="330" y2="614"/>

  <rect class="box" x="390" y="419" width="320" height="215"/>
  <text class="letter" x="410" y="460">G</text>
  <text class="label" x="455" y="442">GROUP, GIVE AWAY, OR GET RID OF</text>
  <text class="small" x="455" y="462">Attach a decision to work outside your top three.</text>
  <text class="tiny" x="455" y="479">Protect priority blocks from lesser work.</text>
  <text class="label" x="410" y="506">GROUP</text>
  <text class="tiny" x="466" y="506">Batch + scheduled time</text>
  <line class="fillline" x1="410" y1="526" x2="680" y2="526"/>
  <line class="fillline" x1="410" y1="545" x2="680" y2="545"/>
  <text class="label" x="410" y="568">GIVE AWAY</text>
  <text class="tiny" x="495" y="568">Owner + result + deadline</text>
  <line class="fillline" x1="410" y1="588" x2="680" y2="588"/>
  <text class="label" x="410" y="613">GET RID OF</text>
  <text class="tiny" x="495" y="613">Delete or decline</text>
  <line class="fillline" x1="580" y1="613" x2="680" y2="613"/>

  <rect class="box" x="740" y="419" width="320" height="215"/>
  <text class="letter" x="760" y="460">E</text>
  <text class="label" x="805" y="442">EVALUATE AND RESET</text>
  <text class="small" x="805" y="462">Record results and make a new decision for misses.</text>
  <text class="tiny" x="805" y="479">Cut, delegate, or reduce unfinished work.</text>
  <text class="tiny" x="760" y="506">1. □ DONE  □ NOT DONE</text>
  <line class="fillline" x1="875" y1="506" x2="1030" y2="506"/>
  <text class="tiny" x="760" y="532">2. □ DONE  □ NOT DONE</text>
  <line class="fillline" x1="875" y1="532" x2="1030" y2="532"/>
  <text class="tiny" x="760" y="558">3. □ DONE  □ NOT DONE</text>
  <line class="fillline" x1="875" y1="558" x2="1030" y2="558"/>
  <text class="tiny" x="760" y="584">ACTUAL REASON / EVIDENCE</text>
  <line class="fillline" x1="760" y1="602" x2="1030" y2="602"/>
  <text class="tiny" x="760" y="624">TOMORROW: CUT • DELEGATE • SMALLER STEP + TIME</text>

  <rect class="mini" x="40" y="654" width="1020" height="156"/>
  <text class="label" x="60" y="679">SEVEN-DAY TRIAGE SCORECARD</text>
  <text class="small" x="60" y="698">Mark YES only when all three priorities were completed and every boundary was protected.</text>

  <text class="tiny" x="61" y="728">DAY</text>
  <text class="tiny" x="128" y="728">1</text>
  <text class="tiny" x="198" y="728">2</text>
  <text class="tiny" x="268" y="728">3</text>
  <text class="tiny" x="338" y="728">4</text>
  <text class="tiny" x="408" y="728">5</text>
  <text class="tiny" x="478" y="728">6</text>
  <text class="tiny" x="548" y="728">7</text>
  <text class="tiny" x="600" y="728">TOTAL YES</text>
  <line class="fillline" x1="660" y1="728" x2="712" y2="728"/>
  <text class="tiny" x="728" y="728">TARGET: 5 OF 7</text>

  <text class="tiny" x="60" y="751">TOP 3 DONE?</text>
  <rect class="soft" x="118" y="739" width="24" height="18"/>
  <rect class="soft" x="188" y="739" width="24" height="18"/>
  <rect class="soft" x="258" y="739" width="24" height="18"/>
  <rect class="soft" x="328" y="739" width="24" height="18"/>
  <rect class="soft" x="398" y="739" width="24" height="18"/>
  <rect class="soft" x="468" y="739" width="24" height="18"/>
  <rect class="soft" x="538" y="739" width="24" height="18"/>

  <text class="tiny" x="60" y="776">BOUNDARIES?</text>
  <rect class="soft" x="118" y="764" width="24" height="18"/>
  <rect class="soft" x="188" y="764" width="24" height="18"/>
  <rect class="soft" x="258" y="764" width="24" height="18"/>
  <rect class="soft" x="328" y="764" width="24" height="18"/>
  <rect class="soft" x="398" y="764" width="24" height="18"/>
  <rect class="soft" x="468" y="764" width="24" height="18"/>
  <rect class="soft" x="538" y="764" width="24" height="18"/>

  <text class="label" x="600" y="755">NEXT RESET</text>
  <text class="tiny" x="600" y="775">One change I will make from the evidence:</text>
  <line class="fillline" x1="600" y1="794" x2="1030" y2="794"/>
</svg>