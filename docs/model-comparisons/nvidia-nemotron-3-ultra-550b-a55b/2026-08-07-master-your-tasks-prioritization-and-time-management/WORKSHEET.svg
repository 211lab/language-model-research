<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the PRIORITIZE action model, and a summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">PURGE</text>
  <text class="small" x="720" y="78">Empty your head onto paper. Every task, loop,</text>
  <text class="small" x="720" y="94">obligation. Nothing stays in mental RAM.</text>

  <text class="verb" x="444" y="142">PRIORITIZE</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <!-- Row 1: P, R, I, O, R -->
  <rect class="box" x="40" y="180" width="190" height="185"/>
  <text class="letter" x="55" y="222">P</text>
  <text class="label" x="95" y="204">PURGE</text>
  <text class="small" x="95" y="224">List every task, idea, obligation.</text>
  <text class="tiny" x="95" y="242">Specific, actionable, nothing vague.</text>
  <line class="fillline" x1="55" y1="270" x2="210" y2="270"/>
  <line class="fillline" x1="55" y1="295" x2="210" y2="295"/>
  <line class="fillline" x1="55" y1="320" x2="210" y2="320"/>
  <line class="fillline" x1="55" y1="345" x2="210" y2="345"/>

  <rect class="box" x="250" y="180" width="190" height="185"/>
  <text class="letter" x="265" y="222">R</text>
  <text class="label" x="305" y="204">RANK</text>
  <text class="small" x="305" y="224">Mark top 3 as A. Rest B or C.</text>
  <text class="tiny" x="305" y="242">Impact only. Ignore noise.</text>
  <text class="tiny" x="265" y="268">A1.</text><line class="fillline" x1="290" y1="268" x2="420" y2="268"/>
  <text class="tiny" x="265" y="292">A2.</text><line class="fillline" x1="290" y1="292" x2="420" y2="292"/>
  <text class="tiny" x="265" y="316">A3.</text><line class="fillline" x1="290" y1="316" x2="420" y2="316"/>
  <text class="tiny" x="265" y="340">B/C:</text><line class="fillline" x1="305" y1="340" x2="420" y2="340"/>

  <rect class="box" x="460" y="180" width="190" height="185"/>
  <text class="letter" x="475" y="222">I</text>
  <text class="label" x="515" y="204">IDENTIFY</text>
  <text class="small" x="515" y="224">Find your 90-min prime window.</text>
  <text class="tiny" x="515" y="242">When thinking feels easiest.</text>
  <text class="tiny" x="475" y="268">Window:</text><line class="fillline" x1="525" y1="268" x2="630" y2="268"/>
  <text class="tiny" x="475" y="292">Title:</text><line class="fillline" x1="525" y1="292" x2="630" y2="292"/>
  <text class="tiny" x="475" y="316">Days:</text><line class="fillline" x1="525" y1="316" x2="630" y2="316"/>

  <rect class="box" x="670" y="180" width="190" height="185"/>
  <text class="letter" x="685" y="222">O</text>
  <text class="label" x="725" y="204">ORGANIZE</text>
  <text class="small" x="725" y="224">Slot B-tasks, batch C-tasks,</text>
  <text class="tiny" x="725" y="242">leave white space buffers.</text>
  <text class="tiny" x="685" y="268">B-block:</text><line class="fillline" x1="750" y1="268" x2="840" y2="268"/>
  <text class="tiny" x="685" y="292">C-batch 1:</text><line class="fillline" x1="750" y1="292" x2="840" y2="292"/>
  <text class="tiny" x="685" y="316">C-batch 2:</text><line class="fillline" x1="750" y1="316" x2="840" y2="316"/>
  <text class="tiny" x="685" y="340">Buffers:</text><line class="fillline" x1="750" y1="340" x2="840" y2="340"/>

  <rect class="box" x="880" y="180" width="190" height="185"/>
  <text class="letter" x="895" y="222">R</text>
  <text class="label" x="935" y="204">REMOVE</text>
  <text class="small" x="935" y="224">Kill friction before start.</text>
  <text class="tiny" x="935" y="242">Tabs, phone, sign, water, doc ready.</text>
  <text class="tiny" x="895" y="268">1.</text><line class="fillline" x1="915" y1="268" x2="1050" y2="268"/>
  <text class="tiny" x="895" y="292">2.</text><line class="fillline" x1="915" y1="292" x2="1050" y2="292"/>
  <text class="tiny" x="895" y="316">3.</text><line class="fillline" x1="915" y1="316" x2="1050" y2="316"/>
  <text class="tiny" x="895" y="340">4.</text><line class="fillline" x1="915" y1="340" x2="1050" y2="340"/>

  <!-- Row 2: I, T, I, Z, E -->
  <rect class="box" x="40" y="395" width="190" height="185"/>
  <text class="letter" x="55" y="437">I</text>
  <text class="label" x="95" y="419">ITERATE</text>
  <text class="small" x="95" y="439">25-min sprints, 5-min breaks.</text>
  <text class="tiny" x="95" y="457">Tally each. 4 sprints = 90 min.</text>
  <text class="tiny" x="55" y="485">Sprints:</text>
  <text class="tiny" x="55" y="505">||||</text>
  <line class="fillline" x1="110" y1="485" x2="210" y2="485"/>
  <line class="fillline" x1="110" y1="505" x2="210" y2="505"/>
  <line class="fillline" x1="55" y1="530" x2="210" y2="530"/>

  <rect class="box" x="250" y="395" width="190" height="185"/>
  <text class="letter" x="265" y="437">T</text>
  <text class="label" x="305" y="419">TRACK</text>
  <text class="small" x="305" y="439">Check off A-tasks visibly.</text>
  <text class="tiny" x="305" y="457">Note why any stalled.</text>
  <text class="tiny" x="265" y="485">✓ A1:</text><line class="fillline" x1="320" y1="485" x2="420" y2="485"/>
  <text class="tiny" x="265" y="509">✓ A2:</text><line class="fillline" x1="320" y1="509" x2="420" y2="509"/>
  <text class="tiny" x="265" y="533">→ A3:</text><line class="fillline" x1="320" y1="533" x2="420" y2="533"/>

  <rect class="box" x="460" y="395" width="190" height="185"/>
  <text class="letter" x="475" y="437">I</text>
  <text class="label" x="515" y="419">INSPECT</text>
  <text class="small" x="515" y="439">Shutdown review. One adjustment.</text>
  <text class="tiny" x="515" y="457">Specific, testable, not vague.</text>
  <text class="tiny" x="475" y="485">Done:</text><line class="fillline" x1="525" y1="485" x2="630" y2="485"/>
  <text class="tiny" x="475" y="509">Derailed:</text><line class="fillline" x1="525" y1="509" x2="630" y2="509"/>
  <text class="tiny" x="475" y="533">Easy:</text><line class="fillline" x1="525" y1="533" x2="630" y2="533"/>
  <text class="tiny" x="475" y="557">Adjust:</text><line class="fillline" x1="525" y1="557" x2="630" y2="557"/>

  <rect class="box" x="670" y="395" width="190" height="185"/>
  <text class="letter" x="685" y="437">Z</text>
  <text class="label" x="725" y="419">ZERO IN</text>
  <text class="small" x="725" y="439">Tonight: write tomorrow's 3 A-tasks.</text>
  <text class="tiny" x="725" y="457">Paper. Specific. Ready at wake.</text>
  <text class="tiny" x="685" y="485">A1:</text><line class="fillline" x1="720" y1="485" x2="840" y2="485"/>
  <text class="tiny" x="685" y="509">A2:</text><line class="fillline" x1="720" y1="509" x2="840" y2="509"/>
  <text class="tiny" x="685" y="533">A3:</text><line class="fillline" x1="720" y1="533" x2="840" y2="533"/>

  <rect class="box" x="880" y="395" width="190" height="185"/>
  <text class="letter" x="895" y="437">E</text>
  <text class="label" x="935" y="419">EXPAND</text>
  <text class="small" x="935" y="439">Weekly scan. Keep what works.</text>
  <text class="tiny" x="935" y="457">Cut overhead. One change/week.</text>
  <text class="tiny" x="895" y="485">Pattern:</text><line class="fillline" x1="945" y1="485" x2="1050" y2="485"/>
  <text class="tiny" x="895" y="509">Pattern:</text><line class="fillline" x1="945" y1="509" x2="1050" y2="509"/>
  <text class="tiny" x="895" y="533">Change:</text><line class="fillline" x1="945" y1="533" x2="1050" y2="533"/>

  <!-- Footer -->
  <rect class="mini" x="40" y="610" width="1020" height="88"/>
  <text class="label" x="60" y="636">DAILY CAST HOUSE RUN</text>
  <text class="small" x="60" y="660">Tonight: write 3 A-tasks. Morning: purge, rank, block 90 min, remove friction, sprint, track, inspect, zero in.</text>
  <line class="fillline" x1="60" y1="684" x2="1030" y2="684"/>

  <rect class="mini" x="40" y="725" width="330" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">PURGE &amp; RANK</text>
  <text class="tiny" x="95" y="768">Empty head. Pick 3 high-impact A-tasks.</text>
  <text class="tiny" x="95" y="784">Everything else is B, C, or delete.</text>

  <rect class="mini" x="390" y="725" width="330" height="82"/>
  <text class="num" x="410" y="760">2</text>
  <text class="label" x="445" y="748">PROTECT &amp; EXECUTE</text>
  <text class="tiny" x="445" y="768">Block prime window. Remove friction.</text>
  <text class="tiny" x="445" y="784">Sprint on A1 only. Track visibly.</text>

  <rect class="mini" x="740" y="725" width="330" height="82"/>
  <text class="num" x="760" y="760">3</text>
  <text class="label" x="795" y="748">INSPECT &amp; EVOLVE</text>
  <text class="tiny" x="795" y="768">Shutdown: one adjustment. Night: next 3.</text>
  <text class="tiny" x="795" y="784">Weekly: double down, cut waste.</text>
</svg>