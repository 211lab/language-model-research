<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the FILTER action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">THE PROBLEM</text>
  <text class="small" x="720" y="78">You end each day exhausted having cleared small</text>
  <text class="small" x="720" y="94">tasks while the one that mattered sat untouched.</text>

  <text class="verb" x="444" y="142">FILTER</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">F</text>
  <text class="label" x="105" y="204">FETCH EVERY TASK</text>
  <text class="small" x="105" y="224">Dump every task from every surface onto this list.</text>
  <text class="tiny" x="105" y="242">Do not sort. Do not rank. Just write them all out.</text>
  <text class="tiny" x="60" y="268">1.</text><line class="fillline" x1="80" y1="268" x2="330" y2="268"/>
  <text class="tiny" x="60" y="292">2.</text><line class="fillline" x1="80" y1="292" x2="330" y2="292"/>
  <text class="tiny" x="60" y="316">3.</text><line class="fillline" x1="80" y1="316" x2="330" y2="316"/>
  <text class="tiny" x="60" y="340">4.</text><line class="fillline" x1="80" y1="340" x2="330" y2="340"/>
  <text class="tiny" x="60" y="356">5.</text><line class="fillline" x1="80" y1="356" x2="330" y2="356"/>

  <rect class="box" x="390" y="180" width="320" height="185"/>
  <text class="letter" x="410" y="222">I</text>
  <text class="label" x="455" y="204">ISOLATE YOUR TOP THREE</text>
  <text class="small" x="455" y="224">Which three tasks create the biggest impact today?</text>
  <text class="tiny" x="455" y="242">If you finish only these three, the day is well spent.</text>
  <text class="tiny" x="410" y="270">A1:</text><line class="fillline" x1="440" y1="270" x2="680" y2="270"/>
  <text class="tiny" x="410" y="300">A2:</text><line class="fillline" x1="440" y1="300" x2="680" y2="300"/>
  <text class="tiny" x="410" y="330">A3:</text><line class="fillline" x1="440" y1="330" x2="680" y2="330"/>
  <line class="fillline" x1="410" y1="356" x2="680" y2="356"/>

  <rect class="box" x="740" y="180" width="320" height="185"/>
  <text class="letter" x="760" y="222">L</text>
  <text class="label" x="805" y="204">LIMIT URGENT NOISE</text>
  <text class="small" x="805" y="224">Sort remaining tasks: delegate, delay, batch, or cut.</text>
  <text class="tiny" x="805" y="242">Say no or later to anything that only feels urgent.</text>
  <text class="tiny" x="760" y="268">Delegate:</text><line class="fillline" x1="825" y1="268" x2="1030" y2="268"/>
  <text class="tiny" x="760" y="292">Delay:</text><line class="fillline" x1="810" y1="292" x2="1030" y2="292"/>
  <text class="tiny" x="760" y="316">Batch:</text><line class="fillline" x1="808" y1="316" x2="1030" y2="316"/>
  <text class="tiny" x="760" y="340">Remove:</text><line class="fillline" x1="820" y1="340" x2="1030" y2="340"/>

  <rect class="box" x="40" y="395" width="320" height="185"/>
  <text class="letter" x="60" y="437">T</text>
  <text class="label" x="105" y="419">TIME-BLOCK THE BIG ROCKS</text>
  <text class="small" x="105" y="439">Assign each A task a protected calendar slot.</text>
  <text class="tiny" x="105" y="457">Use 25-min sprints during your peak energy window.</text>
  <text class="tiny" x="60" y="485">A1 block:</text><line class="fillline" x1="125" y1="485" x2="330" y2="485"/>
  <text class="tiny" x="60" y="515">A2 block:</text><line class="fillline" x1="125" y1="515" x2="330" y2="515"/>
  <text class="tiny" x="60" y="545">A3 block:</text><line class="fillline" x1="125" y1="545" x2="330" y2="545"/>
  <text class="tiny" x="60" y="570">Peak energy time:</text><line class="fillline" x1="160" y1="570" x2="330" y2="570"/>

  <rect class="box" x="390" y="395" width="320" height="185"/>
  <text class="letter" x="410" y="437">E</text>
  <text class="label" x="455" y="419">EXECUTE IN ORDER</text>
  <text class="small" x="455" y="439">Write your sequence. Silence alerts. One task at a time.</text>
  <text class="tiny" x="455" y="457">Hardest task first. No switching mid-sprint.</text>
  <text class="tiny" x="410" y="485">First:</text><line class="fillline" x1="450" y1="485" x2="680" y2="485"/>
  <text class="tiny" x="410" y="515">Second:</text><line class="fillline" x1="462" y1="515" x2="680" y2="515"/>
  <text class="tiny" x="410" y="545">Third:</text><line class="fillline" x1="452" y1="545" x2="680" y2="545"/>
  <text class="tiny" x="410" y="570">B/C batch time:</text><line class="fillline" x1="505" y1="570" x2="680" y2="570"/>

  <rect class="box" x="740" y="395" width="320" height="185"/>
  <text class="letter" x="760" y="437">R</text>
  <text class="label" x="805" y="419">REVIEW AND RESET</text>
  <text class="small" x="805" y="439">Check off what finished. Move or cut what did not.</text>
  <text class="tiny" x="805" y="457">Write tomorrow's top three before you stop working.</text>
  <text class="tiny" x="760" y="485">Completed:</text><line class="fillline" x1="830" y1="485" x2="1030" y2="485"/>
  <text class="tiny" x="760" y="515">Carried over:</text><line class="fillline" x1="845" y1="515" x2="1030" y2="515"/>
  <text class="tiny" x="760" y="545">Cut entirely:</text><line class="fillline" x1="840" y1="545" x2="1030" y2="545"/>
  <text class="tiny" x="760" y="570">Tomorrow A1:</text><line class="fillline" x1="845" y1="570" x2="1030" y2="570"/>

  <rect class="mini" x="40" y="610" width="1020" height="88"/>
  <text class="label" x="60" y="636">FINAL COMMAND</text>
  <text class="small" x="60" y="660">Run this cycle daily for five days. Three tasks done before the day closes. No working late. No skipping breaks.</text>
  <line class="fillline" x1="60" y1="684" x2="1030" y2="684"/>

  <rect class="mini" x="40" y="725" width="315" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">PICK YOUR THREE</text>
  <text class="tiny" x="95" y="768">Isolate the tasks that carry real weight.</text>
  <text class="tiny" x="95" y="784">Urgency is volume. Importance is weight.</text>

  <rect class="mini" x="392" y="725" width="315" height="82"/>
  <text class="num" x="412" y="760">2</text>
  <text class="label" x="447" y="748">GUARD THE BLOCK</text>
  <text class="tiny" x="447" y="768">Protect your time slots like real appointments.</text>
  <text class="tiny" x="447" y="784">Intentions lose to interruptions every time.</text>

  <rect class="mini" x="745" y="725" width="315" height="82"/>
  <text class="num" x="765" y="760">3</text>
  <text class="label" x="800" y="748">STRIKE UNTIL IT MOVES</text>
  <text class="tiny" x="800" y="768">Execute in order. Review. Reset. Repeat.</text>
  <text class="tiny" x="800" y="784">The metal moves when the blow lands clean.</text>
</svg>