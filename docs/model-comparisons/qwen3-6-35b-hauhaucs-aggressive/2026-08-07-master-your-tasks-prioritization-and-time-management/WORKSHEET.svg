<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the SELECT action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">CHOICE</text>
  <text class="small" x="720" y="78">React to the loudest email, or choose the three</text>
  <text class="small" x="720" y="94">tasks that move your life forward and execute them.</text>

  <text class="verb" x="444" y="142">SELECT</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">S</text>
  <text class="label" x="105" y="204">SORT THE NOISE</text>
  <text class="small" x="105" y="224">Dump everything out of your head. Sort into A, B, C.</text>
  <text class="tiny" x="105" y="242">A: Must do today. B: Should do. C: Wait/Delegate.</text>
  <text class="tiny" x="60" y="268">A-Tasks:</text><line class="fillline" x1="130" y1="268" x2="330" y2="268"/>
  <text class="tiny" x="60" y="292">B-Tasks:</text><line class="fillline" x1="130" y1="292" x2="330" y2="292"/>
  <text class="tiny" x="60" y="316">C-Tasks:</text><line class="fillline" x1="130" y1="316" x2="330" y2="316"/>
  <text class="tiny" x="60" y="340">Vague items:</text><line class="fillline" x1="150" y1="340" x2="330" y2="340"/>

  <rect class="box" x="390" y="180" width="320" height="185"/>
  <text class="letter" x="410" y="222">E</text>
  <text class="label" x="455" y="204">ELIMINATE DISTRACTIONS</text>
  <text class="small" x="455" y="224">Identify the top three Big Rocks. Remove noise.</text>
  <text class="tiny" x="455" y="242">Phone away, tabs closed, focus mode on.</text>
  <text class="tiny" x="410" y="268">Big Rock 1:</text><line class="fillline" x1="510" y1="268" x2="680" y2="268"/>
  <text class="tiny" x="410" y="292">Big Rock 2:</text><line class="fillline" x1="510" y1="292" x2="680" y2="292"/>
  <text class="tiny" x="410" y="316">Big Rock 3:</text><line class="fillline" x1="510" y1="316" x2="680" y2="316"/>
  <text class="tiny" x="410" y="340">Distraction to kill:</text><line class="fillline" x1="540" y1="340" x2="680" y2="340"/>

  <rect class="box" x="740" y="180" width="320" height="185"/>
  <text class="letter" x="760" y="222">L</text>
  <text class="label" x="805" y="204">LOCK IN THE TIME</text>
  <text class="small" x="805" y="224">Schedule the three tasks as non-negotiable.</text>
  <text class="tiny" x="805" y="242">Treat them like a meeting with your boss.</text>
  <text class="tiny" x="760" y="268">1. Time:</text><line class="fillline" x1="810" y1="268" x2="1030" y2="268"/>
  <text class="tiny" x="760" y="292">2. Time:</text><line class="fillline" x1="810" y1="292" x2="1030" y2="292"/>
  <text class="tiny" x="760" y="316">3. Time:</text><line class="fillline" x1="810" y1="316"