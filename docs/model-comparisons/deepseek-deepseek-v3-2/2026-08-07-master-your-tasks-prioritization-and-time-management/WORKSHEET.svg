<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the TRIAGE action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS: PRIORITIZATION AND TIME MANAGEMENT</text>
  <text class="sub" x="40" y="96">Build Your Furnace Stack</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">CHOICE</text>
  <text class="small" x="720" y="78">Let the day's noise dictate your effort, or build a</text>
  <text class="small" x="720" y="94">clear stack that directs pressure into progress.</text>

  <text class="verb" x="490" y="142">TRIAGE</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">T</text>
  <text class="label" x="105" y="204">TAKE INVENTORY</text>
  <text class="small" x="105" y="224">Brain dump every task, obligation, and idea.</text>
  <text class="tiny" x="105" y="242">No filtering. Get everything out of your head.</text>
  <text class="tiny" x="60" y="268">1.</text><line class="fillline" x1="80" y1="268" x2="330" y2="268"/>
  <text class="tiny" x="60" y="292">2.</text><line class="fillline" x1="80" y1="292" x2="330" y2="292"/>
  <text class="tiny" x="60" y="316">3.</text><line class="fillline" x1="80" y1="316" x2="330" y2="316"/>
  <text class="tiny" x="60" y="340">4.</text><line class="fillline" x1="80" y1="340" x2="330" y2="340"/>
  <text class="tiny" x="60" y="364">5.</text><line class="fillline" x1="80" y1="364" x2="330" y2="364"/>

  <rect class="box" x="390" y="180" width="320" height="185"/>
  <text class="letter" x="410" y="222">R</text>
  <text class="label" x="455" y="204">RANK BY IMPACT</text>
  <text class="small" x="455" y="224">Circle your top three non-negotiable priorities.</text>
  <text class="tiny" x="455" y="242">Which three would make the biggest difference?</text>
  <text class="tiny" x="410" y="268">Priority 1:</text><line class="fillline" x1="480" y1="268" x2="680" y2="268"/>
  <text class="tiny" x="410" y="292">Priority 2:</text><line class="fillline" x1="480" y1="292" x2="680" y2="292"/>
  <text class="tiny" x="410" y="316">Priority 3:</text><line class="fillline" x1="480" y1="316" x2="680" y2="316"/>

  <rect class="box" x="740" y="180" width="320" height="185"/>
  <text class="letter" x="760" y="222">I</text>
  <text class="label" x="805" y="204">IGNORE THE FALSE URGENT</text>
  <text class="small" x="805" y="224">Decide the fate of remaining tasks.</text>
  <text class="tiny" x="805" y="242">Schedule, delegate, or delete. Create space.</text>
  <text class="tiny" x="760" y="268">Schedule:</text><line class="fillline" x1="830" y1="268" x2="1030" y2="268"/>
  <text class="tiny" x="760" y="292">Delegate:</text><line class="fillline" x1="830" y1="292" x2="1030" y2="292"/>
  <text class="tiny" x="760" y="316">Delete:</text><line class="fillline" x1="830" y1="316" x2="1030" y2="316"/>

  <rect class="box" x="40" y="395" width="320" height="185"/>
  <text class="letter" x="60" y="437">A</text>
  <text class="label" x="105" y="419">ASSIGN PRIME TIME</text>
  <text class="small" x="105" y="439">Block protected time on your calendar.</text>
  <text class="tiny" x="105" y="457">Treat these blocks like critical meetings.</text>
  <text class="tiny" x="60" y="485">STACK 1:</text><line class="fillline" x1="115" y1="485" x2="330" y2="485"/>
  <text class="tiny" x="60" y="515">STACK 2:</text><line class="fillline" x1="115" y1="515" x2="330" y2="515"/>
  <text class="tiny" x="60" y="545">STACK 3:</text><line class="fillline" x1="115" y1="545" x2="330" y2="545"/>

  <rect class="box" x="390" y="395" width="320" height="185"/>
  <text class="letter" x="410" y="437">G</text>
  <text class="label" x="455" y="419">GUARD YOUR FOCUS</text>
  <text class="small" x="455" y="439">Eliminate distractions during your focus block.</text>
  <text class="tiny" x="455" y="457">Your only objective is tangible progress.</text>
  <text class="tiny" x="410" y="485">Distractions to eliminate:</text>
  <line class="fillline" x1="410" y1="500" x2="680" y2="500"/>
  <line class="fillline" x1="410" y1="525" x2="680" y2="525"/>
  <text class="tiny" x="410" y="555">Response if interrupted:</text>
  <line class="fillline" x1="410" y1="570" x2="680" y2="570"/>

  <rect class="box" x="740" y="395" width="320" height="185"/>
  <text class="letter" x="760" y="437">E</text>
  <text class="label" x="805" y="419">EVALUATE AND EVOLVE</text>
  <text class="small" x="805" y="439">Review your day. Gather diagnostic data.</text>
  <text class="tiny" x="805" y="457">Celebrate wins. Move and re-rank unfinished tasks.</text>
  <text class="tiny" x="760" y="485">What worked?</text><line class="fillline" x1="830" y1="485" x2="1030" y2="485"/>
  <text class="tiny" x="760" y="515">What needs adjustment?</text><line class="fillline" x1="830" y1="515" x2="1030" y2="515"/>
  <text class="tiny" x="760" y="545">Tomorrow's first priority:</text><line class="fillline" x1="830" y1="545" x2="1030" y2="545"/>

  <rect class="mini" x="40" y="610" width="1020" height="88"/>
  <text class="label" x="60" y="636">FINAL COMMAND</text>
  <text class="small" x="60" y="660">Today, my energy will be directed by my stack, not by noise. The three tasks I will complete are:</text>
  <line class="fillline" x1="60" y1="684" x2="1030" y2="684"/>

  <rect class="mini" x="40" y="725" width="315" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">INVENTORY</text>
  <text class="tiny" x="95" y="768">Dump every task from your mind.</text>
  <text class="tiny" x="95" y="784">See the full scope.</text>

  <rect class="mini" x="392" y="725" width="315" height="82"/>
  <text class="num" x="412" y="760">2</text>
  <text class="label" x="447" y="748">RANK</text>
  <text class="tiny" x="447" y="768">Circle the three with biggest impact.</text>
  <text class="tiny" x="447" y="784">Make them non-negotiable.</text>

  <rect class="mini" x="745" y="725" width="315" height="82"/>
  <text class="num" x="765" y="760">3</text>
  <text class="label" x="800" y="748">DEFEND</text>
  <text class="tiny" x="800" y="768">Schedule and guard your focus time.</text>
  <text class="tiny" x="800" y="784">Turn priorities into progress.</text>
</svg>