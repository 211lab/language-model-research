<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Master Your Tasks Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, and seven sequential fillable sections built around the P-R-I-O-R-I-T process model for task mastery.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS PRIORITIZATION AND TIME MANAGEMENT</text>
  <text class="sub" x="40" y="96">Move from feeling overwhelmed by noise to feeling calm and in charge of your own time.</text>

  <!-- Introduction/Framing Box -->
  <rect class="mini" x="40" y="130" width="1020" height="100"/>
  <text class="label" x="60" y="156">THE TRAP OF THE URGENT</text>
  <text class="small" x="60" y="176">Mastery is not about doing more; it is about choosing better. Use this process to filter obligations and focus on high-leverage tasks.</text>
  <line class="fillline" x1="60" y1="200" x2="1060" y2="200"/>

  <!-- Process Acronym Header -->
  <text class="verb" x="550" y="250">P R I O R I T</text>
  <line class="line" x1="40" y1="262" x2="1060" y2="262"/>

  <!-- P: Plan the day's big rocks. -->
  <rect class="box" x="40" y="290" width="300" height="180"/>
  <text class="letter" x="60" y="332">P</text>
  <text class="label" x="105" y="312">PLAN BIG ROCKS</text>
  <text class="small" x="105" y="332">Identify 2-3 high-leverage, outcome-based tasks for the day.</text>
  <text class="tiny" x="105" y="352">Avoid small chores. Focus on impact.</text>
  <line class="fillline" x1="60" y1="380" x2="340" y2="380"/>
  <line class="fillline" x1="60" y1="410" x2="340" y2="410"/>
  <line class="fillline" x1="60" y1="440" x2="340" y2="440"/>

  <!-- R: Reserve deep focus time. -->
  <rect class="box" x="360" y="290" width="300" height="180"/>
  <text class="letter" x="380" y="332">R</text>
  <text class="label" x="425" y="312">RESERVE FOCUS TIME</text>
  <text class="small" x="425" y="332">Assign specific, protected time blocks for each big rock.</text>
  <text class="tiny" x="425" y="352">Be specific: Time + Task.</text>
  <line class="fillline" x1="380" y1="380" x2="680" y2="380"/>
  <line class="fillline" x1="380" y1="410" x2="680" y2="410"/>
  <line class="fillline" x1="380" y1="440" x2="680" y2="440"/>

  <!-- I: Identify what to drop. -->
  <rect class="box" x="680" y="290" width="300" height="180"/>
  <text class="letter" x="700" y="332">I</text>
  <text class="label" x="745