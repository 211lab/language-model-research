<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the TRIAGE action model, and a final command footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70" textLength="650" lengthAdjust="spacingAndGlyphs">MASTER YOUR TASKS: PRIORITIZATION AND TIME MANAGEMENT</text>
  <text class="sub" x="40" y="96">Triage Your Tasks to Finish Top Three by Noon</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">CHOICE</text>
  <text class="small" x="720" y="78">Let noise win, or dump tasks and triage your</text>
  <text class="small" x="720" y="94">top three first to own the day by noon.</text>

  <text class="verb" x="485" y="142">TRIAGE</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">T</text>
  <text class="label" x="105" y="204">TASK DUMP</text>
  <text class="small" x="105" y="224">Write every task in your head. Get it all out.</text>
  <text class="tiny" x="105" y="242">Include work, personal, family, nagging pings.</text>
  <line class="fillline" x1="60" y1="264" x2="330" y2="264"/>
  <line class="fillline" x1="60" y1="284" x2="330" y2="284"/>
  <line class="fillline" x1="60" y1="304" x2="330" y2="304"/>
  <line class="fillline" x1="60" y1="324" x2="330" y2="324"/>
  <line class="fillline" x1="60" y1="344" x2="330" y2="344"/>
  <line class="fillline" x1="60" y1="364" x2="330" y2="364"/>

  <rect class="box" x="390" y="180" width="320" height="185"/>
  <text class="letter" x="410" y="222">R</text>
  <text class="label" x="455" y="204">RANK</text>
  <text class="small" x="455" y="224">Mark top 3 as A, next B, errands C.</text>
  <text class="tiny" x="455" y="242">Note what can wait or be delegated.</text>
  <text class="tiny" x="410" y="268">A1</text><line class="fillline" x1="440" y1="268" x2="680" y2="268"/>
  <text class="tiny" x="410" y="292">A2</text><line class="fillline" x1="440" y1="292" x2="680" y2="292"/>
  <text class="tiny" x="410" y="316">A3</text><line class="fillline" x1="440" y1="316" x2="680" y2="316"/>
  <text class="tiny" x="410" y="340">B/C</text><line class="fillline" x1="445" y1="340" x2="680" y2="340"/>
  <text class="tiny" x="410" y="364">DEL</text><line class="fillline" x1="445" y1="364" x2="680" y2="364"/>

  <rect class="box" x="740" y="180" width="320" height="185"/>
  <text class="letter" x="760" y="222">I</text>
  <text class="label" x="805" y="204">IDENTIFY BIG ROCKS</text>
  <text class="small" x="805" y="224">Pick 2–3 A tasks that match goals.</text>
  <text class="tiny" x="805" y="242">They get first claim on your energy.</text>
  <text class="tiny" x="760" y="268">R1</text><line class="fillline" x1="785" y1="268" x2="1030" y2="268"/>
  <text class="tiny" x="760" y="300">R2</text><line class="fillline" x1="785" y1="300" x2="1030" y2="300"/>
  <text class="tiny" x="760" y="332">R3</text><line class="fillline" x1="785" y1="332" x2="1030" y2="332"/>
  <text class="tiny" x="760" y="364">NOTE</text><line class="fillline" x1="800" y1="364" x2="1030" y2="364"/>

  <rect class="box" x="40" y="395" width="320" height="185"/>
  <text class="letter" x="60" y="437">A</text>
  <text class="label" x="105" y="419">ALLOCATE</text>
  <text class="small" x="105" y="439">Block early time for big rocks.</text>
  <text class="tiny" x="105" y="457">Treat block as unmissable meeting.</text>
  <text class="tiny" x="60" y="485">R1</text><line class="fillline" x1="85" y1="485" x2="330" y2="485"/>
  <text class="tiny" x="60" y="515">R2</text><line class="fillline" x1="85" y1="515" x2="330" y2="515"/>
  <text class="tiny" x="60" y="545">R3</text><line class="fillline" x1="85" y1="545" x2="330" y2="545"/>
  <text class="tiny" x="60" y="565">RULE</text><line class="fillline" x1="100" y1="565" x2="330" y2="565"/>

  <rect class="box" x="390" y="395" width="320" height="185"/>
  <text class="letter" x="410" y="437">G</text>
  <text class="label" x="455" y="419">GUARD</text>
  <text class="small" x="455" y="439">Protect focus during each block.</text>
  <text class="tiny" x="455" y="457">Write exact messages and barriers.</text>
  <text class="tiny" x="410" y="485">PHONE</text><line class="fillline" x1="455" y1="485" x2="680" y2="485"/>
  <text class="tiny" x="410" y="515">TELL</text><line class="fillline" x1="455" y1="515" x2="680" y2="515"/>
  <text class="tiny" x="410" y="545">SPACE</text><line class="fillline" x1="455" y1="545" x2="680" y2="545"/>
  <text class="tiny" x="410" y="565">ONLY</text><line class="fillline" x1="455" y1="565" x2="680" y2="565"/>

  <rect class="box" x="740" y="395" width="320" height="185"/>
  <text class="letter" x="760" y="437">E</text>
  <text class="label" x="805" y="419">EVALUATE</text>
  <text class="small" x="805" y="439">Close loop. Re-rank tomorrow.</text>
  <text class="tiny" x="805" y="457">Question tasks never done.</text>
  <text class="tiny" x="760" y="485">DONE</text><line class="fillline" x1="805" y1="485" x2="1030" y2="485"/>
  <text class="tiny" x="760" y="515">MOVE</text><line class="fillline" x1="805" y1="515" x2="1030" y2="515"/>
  <text class="tiny" x="760" y="545">CUT</text><line class="fillline" x1="805" y1="545" x2="1030" y2="545"/>
  <text class="tiny" x="760" y="565">NOTE</text><line class="fillline" x1="805" y1="565" x2="1030" y2="565"/>

  <rect class="mini" x="40" y="610" width="1020" height="88"/>
  <text class="label" x="60" y="636">FINAL COMMAND</text>
  <text class="small" x="60" y="660">Tomorrow at dawn: take this paper, do your top three first, and own the day.</text>
  <text class="small" x="60" y="682">No one will do it for you. The method is on the page; the choice is yours.</text>

  <rect class="mini" x="40" y="725" width="315" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">DUMP &amp; RANK</text>
  <text class="tiny" x="95" y="768">Write all tasks, mark top 3 as A.</text>
  <text class="tiny" x="95" y="784">Note what can wait or be delegated.</text>

  <rect class="mini" x="392" y="725" width="315" height="82"/>
  <text class="num" x="412" y="760">2</text>
  <text class="label" x="447" y="748">BLOCK &amp; GUARD</text>
  <text class="tiny" x="447" y="768">Allocate early time for big rocks.</text>
  <text class="tiny" x="447" y="784">Silence noise, protect the sprint.</text>

  <rect class="mini" x="745" y="725" width="315" height="82"/>
  <text class="num" x="765" y="760">3</text>
  <text class="label" x="800" y="748">EVALUATE</text>
  <text class="tiny" x="800" y="768">Check done, move leftovers, cut waste.</text>
  <text class="tiny" x="800" y="784">Re-rank tomorrow and repeat.</text>
</svg>