<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the FILTER action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">THE FOCUS CHOICE</text>
  <text class="small" x="720" y="78">Trade cheap dopamine traps for high-value momentum.</text>
  <text class="small" x="720" y="94">Complete Big Rocks before the world invades your schedule.</text>

  <text class="verb" x="455" y="142">FILTER</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <!-- STEP 1: F - FAST BRAIN DUMP -->
  <rect class="box" x="40" y="175" width="320" height="195"/>
  <text class="letter" x="60" y="217">F</text>
  <text class="label" x="105" y="199">FAST BRAIN DUMP</text>
  <text class="small" x="105" y="219">Unload every pending task and open loop.</text>
  <text class="tiny" x="105" y="237">Avoid sorting or judging. Extract everything.</text>
  <line class="fillline" x1="60" y1="265" x2="330" y2="265"/>
  <line class="fillline" x1="60" y1="293" x2="330" y2="293"/>
  <line class="fillline" x1="60" y1="321" x2="330" y2="321"/>
  <line class="fillline" x1="60" y1="349" x2="330" y2="349"/>

  <!-- STEP 2: I - IDENTIFY BIG ROCKS -->
  <rect class="box" x="390" y="175" width="320" height="195"/>
  <text class="letter" x="410" y="217">I</text>
  <text class="label" x="455" y="199">IDENTIFY BIG ROCKS</text>
  <text class="small" x="455" y="219">Select 2-3 highest impact priority tasks.</text>
  <text class="tiny" x="455" y="237">Define concrete, non-negotiable deliverables.</text>
  <text class="tiny" x="410" y="265">1.</text><line class="fillline" x1="428" y1="265" x2="680" y2="265"/>
  <text class="tiny" x="410" y="293">2.</text><line class="fillline" x1="428" y1="293" x2="680" y2="293"/>
  <text class="tiny" x="410" y="321">3.</text><line class="fillline" x1="428" y1="321" x2="680" y2="321"/>
  <text class="tiny" x="410" y="349">Target Outcome:</text><line class="fillline" x1="485" y1="349" x2="680" y2="349"/>

  <!-- STEP 3: L - LABEL URGENCY VS IMPORTANCE -->
  <rect class="box" x="740" y="175" width="320" height="195"/>
  <text class="letter" x="760" y="217">L</text>
  <text class="label" x="805" y="199">LABEL URGENCY</text>
  <text class="small" x="805" y="219">Filter secondary tasks from noise.</text>
  <text class="tiny" x="805" y="237">Mark A (Big Rock), B (Secondary), C (Delegate/Drop).</text>
  <text class="tiny" x="760" y="265">Cat B (Secondary):</text><line class="fillline" x1="860" y1="265" x2="1030" y2="265"/>
  <text class="tiny" x="760" y="293">Cat C (Delegate):</text><line class="fillline" x1="855" y1="293" x2="1030" y2="293"/>
  <text class="tiny" x="760" y="321">Drop / Delete:</text><line class="fillline" x1="840" y1="321" x2="1030" y2="321"/>
  <text class="tiny" x="760" y="349">Notes:</text><line class="fillline" x1="800" y1="349" x2="1030" y2="349"/>

  <!-- STEP 4: T - TIME BLOCK PRIORITIES -->
  <rect class="box" x="40" y="385" width="320" height="195"/>
  <text class="letter" x="60" y="427">T</text>
  <text class="label" x="105" y="409">TIME BLOCK PRIORITIES</text>
  <text class="small" x="105" y="429">Lock morning focus windows for Big Rocks.</text>
  <text class="tiny" x="105" y="447">Schedule before reactive demands hit.</text>
  <text class="tiny" x="60" y="475">Block 1:</text><line class="fillline" x1="105" y1="475" x2="330" y2="475"/>
  <text class="tiny" x="60" y="503">Block 2:</text><line class="fillline" x1="105" y1="503" x2="330" y2="503"/>
  <text class="tiny" x="60" y="531">Admin Window:</text><line class="fillline" x1="135" y1="531" x2="330" y2="531"/>
  <text class="tiny" x="60" y="559">Buffer Time:</text><line class="fillline" x1="125" y1="559" x2="330" y2="559"/>

  <!-- STEP 5: E - ELIMINATE DISTRACTIONS -->
  <rect class="box" x="390" y="385" width="320" height="195"/>
  <text class="letter" x="410" y="427">E</text>
  <text class="label" x="455" y="409">ELIMINATE DISTRACTION</text>
  <text class="small" x="455" y="429">Build digital and physical focus shields.</text>
  <text class="tiny" x="455" y="447">Silence notifications, close tabs, isolate focus.</text>
  <text class="tiny" x="410" y="475">Digital Defense:</text><line class="fillline" x1="490" y1="475" x2="680" y2="475"/>
  <text class="tiny" x="410" y="503">Environment:</text><line class="fillline" x1="480" y1="503" x2="680" y2="503"/>
  <text class="tiny" x="410" y="531">Communication:</text><line class="fillline" x1="495" y1="531" x2="680" y2="531"/>
  <text class="tiny" x="410" y="559">Single-task Rule:</text><line class="fillline" x1="495" y1="559" x2="680" y2="559"/>

  <!-- STEP 6: R - REVIEW AND RESET DAILY -->
  <rect class="box" x="740" y="385" width="320" height="195"/>
  <text class="letter" x="760" y="427">R</text>
  <text class="label" x="805" y="409">REVIEW AND RESET DAILY</text>
  <text class="small" x="805" y="429">Evaluate progress and prepare tomorrow.</text>
  <text class="tiny" x="805" y="447">Close open loops tonight for morning speed.</text>
  <text class="tiny" x="760" y="475">Completed:</text><line class="fillline" x1="820" y1="475" x2="1030" y2="475"/>
  <text class="tiny" x="760" y="503">Open / Deferred:</text><line class="fillline" x1="845" y1="503" x2="1030" y2="503"/>
  <text class="tiny" x="760" y="531">Tomorrow Rock #1:</text><line class="fillline" x1="860" y1="531" x2="1030" y2="531"/>
  <text class="tiny" x="760" y="559">Tomorrow Rock #2:</text><line class="fillline" x1="860" y1="559" x2="1030" y2="559"/>

  <!-- FINAL COMMAND / EXECUTION -->
  <rect class="mini" x="40" y="595" width="1020" height="88"/>
  <text class="label" x="60" y="621">DAILY COMMITMENT AND FOCUS WINDOW</text>
  <text class="small" x="60" y="645">My primary Big Rock for tomorrow morning is:</text>
  <line class="fillline" x1="295" y1="645" x2="1030" y2="645"/>
  <text class="small" x="60" y="669">Designated focus block: [ ______________ ] to [ ______________ ]   |   Distraction Defense Active: [   ] Yes</text>

  <!-- SUMMARY FOOTER -->
  <rect class="mini" x="40" y="698" width="315" height="85"/>
  <text class="num" x="60" y="733">1</text>
  <text class="label" x="95" y="721">FILTER NOISE</text>
  <text class="tiny" x="95" y="741">Dump working memory completely.</text>
  <text class="tiny" x="95" y="757">Extract top 3 Big Rocks from false urgency.</text>

  <rect class="mini" x="392" y="698" width="315" height="85"/>
  <text class="num" x="412" y="733">2</text>
  <text class="label" x="447" y="721">TIME BLOCK</text>
  <text class="tiny" x="447" y="741">Lock early morning focus windows.</text>
  <text class="tiny" x="447" y="757">Shield attention from external chaos.</text>

  <rect class="mini" x="745" y="698" width="315" height="85"/>
  <text class="num" x="765" y="733">3</text>
  <text class="label" x="800" y="721">EXECUTE &amp; RESET</text>
  <text class="tiny" x="800" y="741">Work with single-task intensity.</text>
  <text class="tiny" x="800" y="757">Review daily and reset for tomorrow.</text>
</svg>