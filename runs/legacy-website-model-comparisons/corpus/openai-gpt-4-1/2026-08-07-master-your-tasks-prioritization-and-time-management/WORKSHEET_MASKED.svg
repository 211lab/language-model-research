  <text class="letter" x="760" y="410">R</text>
  <rect class="mask2" x="805" y="384" width="220" height="18" rx="4"/>
  <rect class="mask3" x="805" y="410" width="200" height="14" rx="3"/>
  <rect class="mask3" x="805" y="428" width="180" height="12" rx="3"/>
