  <text class="letter" x="60" y="410">T</text>
  <rect class="mask2" x="105" y="384" width="220" height="18" rx="4"/>
  <rect class="mask3" x="105" y="410" width="200" height="14" rx="3"/>
  <rect class="mask3" x="105" y="428" width="180" height="12" rx="3"/>
