  <text class="letter" x="760" y="220">L</text>
  <rect class="mask2" x="805" y="192" width="140" height="20" rx="4"/>
  <rect class="mask3" x="805" y="220" width="200" height="14" rx="3"/>
  <rect class="mask3" x="805" y="238" width="180" height="12" rx="3"/>
  <rect class="mask4" x="760" y="256" width="280" height="14" rx="3"/>
  <rect class="mask5" x="760" y="276" width="280" height="14" rx="3"/>
  <rect class="mask4" x="760" y="296" width="280" height="14" rx="3"/>
  <rect class="mask5" x="760" y="316" width="280" height="14" rx="3"/>
