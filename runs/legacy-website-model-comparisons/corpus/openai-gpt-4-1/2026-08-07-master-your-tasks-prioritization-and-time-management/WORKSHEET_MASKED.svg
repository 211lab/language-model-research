  <text class="num" x="60" y="685">1</text>
  <rect class="mask7" x="95" y="663" width="180" height="16" rx="4"/>
  <rect class="mask8" x="95" y="687" width="200" height="12" rx="3"/>
  <rect class="mask9" x="95" y="703" width="180" height="12" rx="3"/>

  <rect class="mini" x="392" y="650" width="315" height="82"/>
  <text class="num" x="412" y="685">2</text>
  <rect class="mask7" x="447" y="663" width="200" height="16" rx="4"/>
