  <rect class="mask3" x="455" y="410" width="200" height="14" rx="3"/>
  <rect class="mask3" x="455" y="428" width="180" height="12" rx="3"/>
  <rect class="mask4" x="410" y="442" width="280" height="14" rx="3"/>
