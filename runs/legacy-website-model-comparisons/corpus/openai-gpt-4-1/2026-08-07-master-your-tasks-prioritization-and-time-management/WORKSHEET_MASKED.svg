  <rect class="mini" x="40" y="530" width="1020" height="90"/>
  <rect class="mask7" x="60" y="546" width="180" height="18" rx="4"/>
  <rect class="mask8" x="60" y="570" width="900" height="16" rx="4"/>
  <rect class="mask9" x="60" y="594" width="970" height="12" rx="3"/>
  <rect class="mask8" x="60" y="618" width="970" height="12" rx="3"/>

