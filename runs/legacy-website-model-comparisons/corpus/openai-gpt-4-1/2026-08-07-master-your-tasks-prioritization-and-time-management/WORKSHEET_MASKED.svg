  <rect class="mask2" x="720" y="50" width="320" height="18" rx="4"/>
  <rect class="mask3" x="720" y="74" width="320" height="14" rx="3"/>
  <rect class="mask3" x="720" y="92" width="220" height="12" rx="3"/>

  <text class="verb" x="444" y="142">FILTER</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <!-- FOCUS FIRST -->
  <rect class="box" x="40" y="180" width="320" height="170"/>
  <text class="letter" x="60" y="220">F</text>
  <rect class="mask2" x="105" y="192" width="200" height="20" rx="4"/>
  <rect class="mask3" x="105" y="220" width="220" height="14" rx="3"/>
  <rect class="mask3" x="105" y="238" width="180" height="12" rx="3"/>
