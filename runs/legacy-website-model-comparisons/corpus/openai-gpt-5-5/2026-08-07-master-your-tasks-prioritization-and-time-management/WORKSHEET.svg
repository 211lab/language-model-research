<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks: Prioritization and Time Management</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the TRIAGE action model, and a weekly execution footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="65">Master Your Tasks:</text>
  <text class="title" x="40" y="96">Prioritization and Time Management</text>
  <text class="sub" x="40" y="122">Turn the task pile into a daily plan that protects what matters.</text>

  <rect class="mini" x="700" y="34" width="360" height="94"/>
  <text class="label" x="720" y="58">TRAP EVERY TASK IN ONE PLACE</text>
  <text class="small" x="720" y="78">Get work, errands, follow-ups, bills, and promises</text>
  <text class="small" x="720" y="94">out of your head and into one trusted system.</text>
  <text class="tiny" x="720" y="113">Memory is for thinking, not task storage.</text>

  <text class="verb" x="430" y="156">TRIAGE</text>
  <line class="line" x1="40" y1="168" x2="1060" y2="168"/>

  <rect class="box" x="40" y="188" width="320" height="190"/>
  <text class="letter" x="60" y="230">T</text>
  <text class="label" x="105" y="212">TRAP EVERY TASK IN ONE PLACE</text>
  <text class="small" x="105" y="232">Capture every open loop before ranking anything.</text>
  <text class="tiny" x="105" y="250">Use concrete task language, not vague categories.</text>
  <text class="tiny" x="60" y="277">Trusted place:</text><line class="fillline" x1="130" y1="277" x2="330" y2="277"/>
  <text class="tiny" x="60" y="304">1.</text><line class="fillline" x1="78" y1="304" x2="330" y2="304"/>
  <text class="tiny" x="60" y="328">2.</text><line class="fillline" x1="78" y1="328" x2="330" y2="328"/>
  <text class="tiny" x="60" y="352">3.</text><line class="fillline" x1="78" y1="352" x2="330" y2="352"/>

  <rect class="box" x="390" y="188" width="320" height="190"/>
  <text class="letter" x="410" y="230">R</text>
  <text class="label" x="455" y="212">RANK BY IMPACT, NOT NOISE</text>
  <text class="small" x="455" y="232">Choose what creates the biggest result or prevents</text>
  <text class="small" x="455" y="248">the biggest problem today.</text>
  <text class="tiny" x="410" y="277">A1:</text><line class="fillline" x1="435" y1="277" x2="680" y2="277"/>
  <text class="tiny" x="410" y="301">A2:</text><line class="fillline" x1="435" y1="301" x2="680" y2="301"/>
  <text class="tiny" x="410" y="325">A3:</text><line class="fillline" x1="435" y1="325" x2="680" y2="325"/>
  <text class="tiny" x="410" y="349">Move or delegate:</text><line class="fillline" x1="485" y1="349" x2="680" y2="349"/>

  <rect class="box" x="740" y="188" width="320" height="190"/>
  <text class="letter" x="760" y="230">I</text>
  <text class="label" x="805" y="212">INSTALL THE BIG ROCKS FIRST</text>
  <text class="small" x="805" y="232">Put A tasks into protected blocks before low-value</text>
  <text class="small" x="805" y="248">work gets a vote.</text>
  <text class="tiny" x="760" y="277">Time:</text><line class="fillline" x1="795" y1="277" x2="860" y2="277"/><text class="tiny" x="870" y="277">Task:</text><line class="fillline" x1="900" y1="277" x2="1030" y2="277"/>
  <text class="tiny" x="760" y="305">Time:</text><line class="fillline" x1="795" y1="305" x2="860" y2="305"/><text class="tiny" x="870" y="305">Task:</text><line class="fillline" x1="900" y1="305" x2="1030" y2="305"/>
  <text class="tiny" x="760" y="333">Time:</text><line class="fillline" x1="795" y1="333" x2="860" y2="333"/><text class="tiny" x="870" y="333">Task:</text><line class="fillline" x1="900" y1="333" x2="1030" y2="333"/>
  <text class="tiny" x="760" y="358">Best-energy block:</text><line class="fillline" x1="850" y1="358" x2="1030" y2="358"/>

  <rect class="box" x="40" y="408" width="320" height="190"/>
  <text class="letter" x="60" y="450">A</text>
  <text class="label" x="105" y="432">ATTACK ONE PRIORITY AT A TIME</text>
  <text class="small" x="105" y="452">Set execution rules before the priority block starts.</text>
  <text class="tiny" x="105" y="470">Remove escape routes and stop only when done or time ends.</text>
  <text class="tiny" x="60" y="498">Remove:</text><line class="fillline" x1="105" y1="498" x2="330" y2="498"/>
  <text class="tiny" x="60" y="526">Keep open:</text><line class="fillline" x1="118" y1="526" x2="330" y2="526"/>
  <text class="tiny" x="60" y="554">Stop when:</text><line class="fillline" x1="118" y1="554" x2="330" y2="554"/>
  <text class="tiny" x="60" y="579">If I self-interrupt, I will:</text><line class="fillline" x1="175" y1="579" x2="330" y2="579"/>

  <rect class="box" x="390" y="408" width="320" height="190"/>
  <text class="letter" x="410" y="450">G</text>
  <text class="label" x="455" y="432">GROUP THE SMALLER WORK</text>
  <text class="small" x="455" y="452">Batch B and C tasks so small work stays controlled.</text>
  <text class="tiny" x="455" y="470">Messages, calls, errands, admin, and chores get windows.</text>
  <text class="tiny" x="410" y="498">Email/messages:</text><line class="fillline" x1="485" y1="498" x2="680" y2="498"/>
  <text class="tiny" x="410" y="526">Calls:</text><line class="fillline" x1="445" y1="526" x2="680" y2="526"/>
  <text class="tiny" x="410" y="554">Admin/chores:</text><line class="fillline" x1="478" y1="554" x2="680" y2="554"/>
  <text class="tiny" x="410" y="579">Errands:</text><line class="fillline" x1="455" y1="579" x2="680" y2="579"/>

  <rect class="box" x="740" y="408" width="320" height="190"/>
  <text class="letter" x="760" y="450">E</text>
  <text class="label" x="805" y="432">EVALUATE AND RESET DAILY</text>
  <text class="small" x="805" y="452">Check off what finished, decide on leftovers, and</text>
  <text class="small" x="805" y="468">choose tomorrow's top 3 before the day begins.</text>
  <text class="tiny" x="760" y="498">Completed proof:</text><line class="fillline" x1="838" y1="498" x2="1030" y2="498"/>
  <text class="tiny" x="760" y="526">Carry, cut, break, or delegate:</text><line class="fillline" x1="895" y1="526" x2="1030" y2="526"/>
  <text class="tiny" x="760" y="554">Tomorrow A1:</text><line class="fillline" x1="828" y1="554" x2="1030" y2="554"/>
  <text class="tiny" x="760" y="579">Tomorrow A2/A3:</text><line class="fillline" x1="848" y1="579" x2="1030" y2="579"/>

  <rect class="mini" x="40" y="625" width="1020" height="82"/>
  <text class="label" x="60" y="650">DAILY ANVIL PLAN</text>
  <text class="small" x="60" y="674">The first protected block I will act on today is:</text>
  <line class="fillline" x1="310" y1="674" x2="1030" y2="674"/>
  <text class="small" x="60" y="696">The first distraction I will remove before starting is:</text>
  <line class="fillline" x1="330" y1="696" x2="1030" y2="696"/>

  <rect class="mini" x="40" y="730" width="315" height="82"/>
  <text class="num" x="60" y="765">1</text>
  <text class="label" x="95" y="753">CAPTURE THE PILE</text>
  <text class="tiny" x="95" y="773">One trusted place beats memory, sticky notes,</text>
  <text class="tiny" x="95" y="789">texts, inboxes, and half-remembered promises.</text>

  <rect class="mini" x="392" y="730" width="315" height="82"/>
  <text class="num" x="412" y="765">2</text>
  <text class="label" x="447" y="753">PROTECT THE TOP 3</text>
  <text class="tiny" x="447" y="773">Schedule the A tasks before noise, ease,</text>
  <text class="tiny" x="447" y="789">or other people's urgency owns the day.</text>

  <rect class="mini" x="745" y="730" width="315" height="82"/>
  <text class="num" x="765" y="765">3</text>
  <text class="label" x="800" y="753">RESET BEFORE TOMORROW</text>
  <text class="tiny" x="800" y="773">Finish with proof, a cleaned-up list,</text>
  <text class="tiny" x="800" y="789">and tomorrow's priorities already chosen.</text>
</svg>