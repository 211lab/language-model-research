<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the FOCUS action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">Prioritization and Time Management</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">CHOOSE</text>
  <text class="small" x="720" y="78">If you could only do three things today,</text>
  <text class="small" x="720" y="94">which three would create the biggest impact?</text>

  <text class="verb" x="550" y="142" text-anchor="middle">FOCUS</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <!-- Row 1: Filter, Order, Carve -->
  <rect class="box" x="40" y="180" width="320" height="230"/>
  <text class="letter" x="60" y="222">F</text>
  <text class="label" x="105" y="204">FILTER YOUR FULL LIST</text>
  <text class="small" x="60" y="250">Dump every task. Circle your top 3 A-tasks.</text>
  <text class="tiny" x="60" y="268">Avoid vague tasks. Be specific.</text>
  <line class="fillline" x1="60" y1="286" x2="330" y2="286"/>
  <line class="fillline" x1="60" y1="316" x2="330" y2="316"/>
  <line class="fillline" x1="60" y1="346" x2="330" y2="346"/>
  <text class="tiny" x="60" y="376">My A-Tasks:</text>
  <text class="tiny" x="60" y="390">1.</text><line class="fillline" x1="75" y1="390" x2="330" y2="390"/>
  <text class="tiny" x="60" y="415">2.</text><line class="fillline" x1="75" y1="415" x2="330" y2="415"/>
  <text class="tiny" x="60" y="440">3.</text><line class="fillline" x1="75" y1="440" x2="330" y2="440"/>

  <rect class="box" x="390" y="180" width="320" height="230"/>
  <text class="letter" x="410" y="222">O</text>
  <text class="label" x="455" y="204">ORDER BY IMPACT</text>
  <text class="small" x="410" y="250">Rank your A-tasks by long-term value.</text>
  <text class="tiny" x="410" y="268">Not by urgency, not by deadline.</text>
  <text class="tiny" x="410" y="296">1. (Highest Impact)</text><line class="fillline" x1="520" y1="296" x2="680" y2="296"/>
  <text class="tiny" x="410" y="326">2.</text><line class="fillline" x1="520" y1="326" x2="680" y2="326"/>
  <text class="tiny" x="410" y="356">3.</text><line class="fillline" x1="520" y1="356" x2="680" y2="356"/>

  <rect class="box" x="740" y="180" width="320" height="230"/>
  <text class="letter" x="760" y="222">C</text>
  <text class="label" x="805" y="204">CARVE OUT PROTECTED TIME</text>
  <text class="small" x="760" y="250">Block specific time slots for each A-task.</text>
  <text class="tiny" x="760" y="268">Match tasks to your energy levels.</text>
  <text class="tiny" x="760" y="296">Task 1:</text><line class="fillline" x1="810" y1="296" x2="900" y2="296"/><text class="tiny" x="910" y="296">@</text><line class="fillline" x1="925" y1="296" x2="1030" y2="296"/>
  <text class="tiny" x="760" y="326">Task 2:</text><line class="fillline" x1="810" y1="326" x2="900" y2="326"/><text class="tiny" x="910" y="326">@</text><line class="fillline" x1="925" y1="326" x2="1030" y2="326"/>
  <text class="tiny" x="760" y="356">Task 3:</text><line class="fillline" x1="810" y1="356" x2="900" y2="356"/><text class="tiny" x="910" y="356">@</text><line class="fillline" x1="925" y1="356" x2="1030" y2="356"/>

  <!-- Row 2: Undertake, Savor -->
  <rect class="box" x="40" y="440" width="510" height="230"/>
  <text class="letter" x="60" y="482">U</text>
  <text class="label" x="105" y="464">UNDERTAKE ONE TASK AT A TIME</text>
  <text class="small" x="60" y="510">Single-task during each block. No switching.</text>
  <text class="tiny" x="60" y="528">Multitasking costs 20 minutes of momentum per switch.</text>
  <text class="tiny" x="60" y="556">Block 1 Focus:</text><line class="fillline" x1="155" y1="556" x2="520" y2="556"/>
  <text class="tiny" x="60" y="581">Block 2 Focus:</text><line class="fillline" x1="155" y1="581" x2="520" y2="581"/>
  <text class="tiny" x="60" y="606">Block 3 Focus:</text><line class="fillline" x1="155" y1="606" x2="520" y2="606"/>
  <text class="tiny" x="60" y="631">Recovery Action (when distracted):</text><line class="fillline" x1="245" y1="631" x2="520" y2="631"/>

  <rect class="box" x="580" y="440" width="480" height="230"/>
  <text class="letter" x="600" y="482">S</text>
  <text class="label" x="645" y="464">SAVOR COMPLETION &amp; REVIEW</text>
  <text class="small" x="600" y="510">Check off tasks. Review what got done.</text>
  <text class="tiny" x="600" y="528">Carry forward or cut. Be honest.</text>
  <text class="tiny" x="600" y="556">Completed:</text><line class="fillline" x1="670" y1="556" x2="1030" y2="556"/>
  <text class="tiny" x="600" y="581">Carried Over:</text><line class="fillline" x1="685" y1="581" x2="1030" y2="581"/>
  <text class="tiny" x="600" y="606">Reason:</text><line class="fillline" x1="650" y1="606" x2="1030" y2="606"/>
  <text class="tiny" x="600" y="631">Cut:</text><line class="fillline" x1="630" y1="631" x2="1030" y2="631"/>
  <text class="tiny" x="600" y="656">Why:</text><line class="fillline" x1="635" y1="656" x2="1030" y2="656"/>

  <!-- Summary Section -->
  <rect class="mini" x="40" y="700" width="1020" height="70"/>
  <text class="label" x="60" y="724">MY TODAY'S FOCUS PLAN</text>
  <text class="tiny" x="60" y="748">1.</text><line class="fillline" x1="80" y1="748" x2="320" y2="748"/><text class="tiny" x="330" y="748">@</text><line class="fillline" x1="345" y1="748" x2="400" y2="748"/>
  <text class="tiny" x="420" y="748">2.</text><line class="fillline" x1="440" y1="748" x2="680" y2="748"/><text class="tiny" x="690" y="748">@</text><line class="fillline" x1="705" y1="748" x2="760" y2="748"/>
  <text class="tiny" x="780" y="748">3.</text><line class="fillline" x1="800" y1="748" x2="960" y2="748"/><text class="tiny" x="970" y="748">@</text><line class="fillline" x1="985" y1="748" x2="1030" y2="748"/>

  <!-- Footer Summary Steps -->
  <rect class="mini" x="40" y="790" width="320" height="70"/>
  <text class="num" x="60" y="830">1</text>
  <text class="label" x="95" y="816">FILTER</text>
  <text class="tiny" x="95" y="836">Dump the noise. Find your top 3.</text>

  <rect class="mini" x="390" y="790" width="320" height="70"/>
  <text class="num" x="410" y="830">2</text>
  <text class="label" x="445" y="816">ORDER</text>
  <text class="tiny" x="445" y="836">Rank by real impact, not urgency.</text>

  <rect class="mini" x="740" y="790" width="320" height="70"/>
  <text class="num" x="760" y="830">3</text>
  <text class="label" x="795" y="816">EXECUTE</text>
  <text class="tiny" x="795" y="836">Protect your blocks. Finish.</text>

  <!-- Masking blocks -->
  <g fill="#cccccc">
    <rect x="702" y="36" width="356" height="74"/>
  </g>
  <g fill="#bbbbbb">
    <rect x="105" y="195" width="225" height="20"/>
    <rect x="455" y="195" width="225" height="20"/>
    <rect x="60" y="344" width="270" height="4"/>
    <rect x="410" y="346" width="270" height="15"/>
    <rect x="760" y="316" width="270" height="15"/>
    <rect x="60" y="571" width="460" height="15"/>
    <rect x="600" y="500" width="430" height="15"/>
    <rect x="600" y="621" width="430" height="15"/>
    <rect x="742" y="792" width="316" height="66"/>
  </g>
  <g fill="#aaaaaa">
    <rect x="60" y="240" width="270" height="15"/>
    <rect x="60" y="366" width="90" height="15"/>
    <rect x="410" y="240" width="270" height="15"/>
    <rect x="805" y="195" width="225" height="20"/>
    <rect x="760" y="346" width="270" height="15"/>
    <rect x="60" y="596" width="460" height="15"/>
    <rect x="600" y="518" width="430" height="15"/>
    <rect x="600" y="646" width="430" height="15"/>
    <rect x="392" y="792" width="316" height="66"/>
  </g>
  <g fill="#999999">
    <rect x="60" y="258" width="270" height="15"/>
    <rect x="60" y="380" width="270" height="15"/>
    <rect x="410" y="258" width="270" height="15"/>
    <rect x="760" y="240" width="270" height="15"/>
    <rect x="105" y="454" width="375" height="20"/>
    <rect x="60" y="546" width="460" height="15"/>
    <rect x="600" y="546" width="430" height="15"/>
    <rect x="42" y="702" width="1016" height="66"/>
  </g>
  <g fill="#888888">
    <rect x="60" y="284" width="270" height="4"/>
    <rect x="60" y="405" width="270" height="15"/>
    <rect x="410" y="286" width="270" height="15"/>
    <rect x="760" y="258" width="270" height="15"/>
    <rect x="60" y="500" width="460" height="15"/>
    <rect x="60" y="621" width="460" height="15"/>
    <rect x="600" y="571" width="430" height="15"/>
    <rect x="42" y="792" width="316" height="66"/>
  </g>
  <g fill="#cccccc">
    <rect x="60" y="314" width="270" height="4"/>
    <rect x="60" y="430" width="270" height="15"/>
    <rect x="410" y="316" width="270" height="15"/>
    <rect x="760" y="286" width="270" height="15"/>
    <rect x="60" y="518" width="460" height="15"/>
    <rect x="600" y="596" width="430" height="15"/>
  </g>
</svg>