name: Publish research radar

on:
  push:
    branches: [main]
    paths:
      - "docs/model-comparisons/**"
      - "docs/assistant-benchmark/**"
      - "runs/**"
      - "schemas/**"
      - "tools/benchmark/**"
      - "automation/content_scoring/rubrics/**"
      - "scripts/**"
      - "research-runs.html"
      - "run-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static dashboard
        run: |
          python tools/benchmark/evidence.py validate
          python tools/benchmark/evidence.py registry --check
          python scripts/build_radar.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
