context:
  title: LETTER TITLE GOES HERE
  slug: letter-title-goes-here
  date: YYYY-MM-DD
  target_dir: content/letters/YYYY-MM-DD-slug
providers:
  text:
    kind: openai-compatible
    providerUrl: http://localhost:11434
    model: active
    timeout_seconds: 300
    retry_attempts: 4
    retry_wait_seconds: 75
  image:
    kind: openai-compatible
    providerUrl: http://localhost:11434
    model: unsloth-qwen-image-2512-gguf-qwen-image-2512-q4-k-m
    timeout_seconds: 900
    retry_attempts: 4
    retry_wait_seconds: 75
  audio:
    kind: openai-compatible
    providerUrl: http://localhost:11434
    model: AUDIO_MODEL_NAME
variables:
  voice: direct, pragmatic, masculine, concrete
  audience: men who need structure, ownership, and steady action
tracks:
  promo_assets: false
  landing_page: false
steps:
- id: lesson
  format: markdown
  prompt_file: automation/prompts/burn/lesson.md
  output: content/letters/YYYY-MM-DD-slug/LESSON.md
  inputs:
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - path: content/letters/YYYY-MM-DD-slug/SEED.md
    alias: seed
  - path: content/letters/YYYY-MM-DD-slug/index.md
    alias: draft_index
- id: instructions
  format: markdown
  prompt_file: automation/prompts/burn/instructions.md
  depends_on:
  - lesson
  output: content/letters/YYYY-MM-DD-slug/INSTRUCTIONS.md
  inputs:
  - step: lesson
    alias: lesson
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - path: content/letters/YYYY-MM-DD-slug/SEED.md
    alias: seed
- id: gpt
  format: markdown
  prompt_file: automation/prompts/burn/gpt.md
  depends_on:
  - instructions
  output: content/letters/YYYY-MM-DD-slug/GPT.md
  inputs:
  - step: instructions
    alias: instructions
- id: worksheet
  format: svg
  prompt_file: automation/prompts/burn/worksheet-svg.md
  depends_on:
  - lesson
  - instructions
  output: content/letters/YYYY-MM-DD-slug/WORKSHEET.svg
  inputs:
  - step: instructions
    alias: instructions
- id: worksheet_masked
  format: svg
  prompt_file: automation/prompts/burn/worksheet-masked-svg.md
  depends_on:
  - worksheet
  output: content/letters/YYYY-MM-DD-slug/WORKSHEET_MASKED.svg
  inputs:
  - step: worksheet
    alias: worksheet
- id: promo
  format: markdown
  prompt_file: automation/prompts/burn/promo-image.md
  depends_on:
  - worksheet_masked
  - index
  - cover_image
  tracks:
  - promo_assets
  output: content/letters/YYYY-MM-DD-slug/PROMO_PROMPT.md
  inputs:
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - step: worksheet_masked
    alias: worksheet_masked
- id: promo_image
  format: png
  modality: image
  prompt_file: automation/prompts/burn/render-image.md
  depends_on:
  - promo
  tracks:
  - promo_assets
  output: content/letters/YYYY-MM-DD-slug/promo.png
  inputs:
  - step: promo
    alias: asset_prompt
- id: banner
  format: markdown
  prompt_file: automation/prompts/burn/banner-image.md
  depends_on:
  - worksheet_masked
  - promo
  - index
  - cover_image
  tracks:
  - promo_assets
  output: content/letters/YYYY-MM-DD-slug/BANNER_PROMPT.md
  inputs:
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - step: worksheet_masked
    alias: worksheet_masked
  - step: promo
    alias: promo
- id: banner_image
  format: png
  modality: image
  prompt_file: automation/prompts/burn/render-image.md
  depends_on:
  - banner
  tracks:
  - promo_assets
  output: content/letters/YYYY-MM-DD-slug/banner.png
  inputs:
  - step: banner
    alias: asset_prompt
- id: cover
  format: markdown
  prompt_file: automation/prompts/burn/cover-image.md
  depends_on:
  - index
  output: content/letters/YYYY-MM-DD-slug/COVER_PROMPT.md
  inputs:
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - step: index
    alias: long_form
- id: cover_image
  format: png
  modality: image
  prompt_file: automation/prompts/burn/render-image.md
  depends_on:
  - cover
  output: content/letters/YYYY-MM-DD-slug/cover.png
  inputs:
  - step: cover
    alias: asset_prompt
- id: page_copy
  format: markdown
  prompt_file: automation/prompts/burn/page-copy.md
  depends_on:
  - promo
  - banner
  tracks:
  - landing_page
  output: content/letters/YYYY-MM-DD-slug/PAGE_COPY.md
  inputs:
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - step: promo
    alias: promo
  - step: banner
    alias: banner
- id: landing_page
  format: html
  prompt_file: automation/prompts/burn/landing-page-html.md
  depends_on:
  - banner
  - page_copy
  tracks:
  - landing_page
  output: content/letters/YYYY-MM-DD-slug/LANDING_PAGE.html
  inputs:
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - step: banner
    alias: banner
  - step: page_copy
    alias: page_copy
- id: worksheet_page
  format: markdown
  prompt_file: automation/prompts/burn/worksheet-page-prototype.md
  depends_on:
  - promo
  - page_copy
  tracks:
  - landing_page
  output: content/letters/YYYY-MM-DD-slug/WORKSHEET_PAGE.md
  inputs:
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
  - step: promo
    alias: promo
  - step: page_copy
    alias: page_copy
- id: index
  format: markdown
  prompt_file: automation/prompts/burn/index.md
  depends_on:
  - lesson
  output: content/letters/YYYY-MM-DD-slug/index.md
  inputs:
  - step: lesson
    alias: lesson
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
- id: newsletter_email
  format: markdown
  prompt_file: automation/prompts/burn/newsletter-email.md
  depends_on:
  - index
  - lesson
  - instructions
  - gpt
  output: content/letters/YYYY-MM-DD-slug/NEWSLETTER_EMAIL.md
  inputs:
  - step: index
    alias: index
  - step: lesson
    alias: lesson
  - step: instructions
    alias: instructions
  - step: gpt
    alias: gpt
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
- id: community_post
  format: markdown
  prompt_file: automation/prompts/burn/community-post.md
  depends_on:
  - index
  output: content/letters/YYYY-MM-DD-slug/COMMUNITY_POST.md
  inputs:
  - step: index
    alias: index
  - path: content/letters/YYYY-MM-DD-slug/CONTEXT.md
    alias: context
